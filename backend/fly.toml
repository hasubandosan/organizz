app = "CHANGE-ME-unique-app-name"
primary_region = "waw"  # Варшава — ближайший к вам free-регион Fly.io

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

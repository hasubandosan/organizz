<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0a0a0f"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Purchases — LifeOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../core/styles.css"/>

  <style>
    /* ── MODULE-LOCAL OVERRIDES ── */
    html, body { height: 100%; overflow: hidden; }
    body { font-size: 14px; }

    #app { display: flex; flex-direction: column; height: 100dvh; }

    /* ── HEADER ── */
    .purch-hdr {
      flex-shrink: 0;
      background: rgba(10,10,15,.97);
      border-bottom: 1px solid var(--border);
      padding-top: var(--st);
    }
    .purch-hdr-top {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px 10px;
    }
    .purch-title { font-size: 18px; font-weight: 800; letter-spacing: -.4px; flex: 1; }
    .purch-title span { color: var(--accent2); }
    .hdr-btn {
      width: 34px; height: 34px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg3); border: 1px solid var(--border2);
      color: var(--text2); font-size: 15px; transition: .15s;
    }
    .hdr-btn:hover  { background: var(--bg4); color: var(--text); }
    .hdr-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* STATUS TABS */
    .status-tabs {
      display: flex; gap: 4px; padding: 0 16px 10px;
      overflow-x: auto; scrollbar-width: none;
    }
    .status-tabs::-webkit-scrollbar { display: none; }
    .stab {
      flex-shrink: 0; padding: 5px 12px; border-radius: 100px;
      font-size: 12px; font-weight: 600; border: 1px solid var(--border2);
      color: var(--text3); background: var(--bg3); transition: .15s; cursor: pointer;
    }
    .stab.on { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* SEARCH + GRID CTRL */
    .search-row { display: flex; gap: 8px; padding: 0 16px 8px; }
    .search-box {
      flex: 1; display: flex; align-items: center; gap: 8px;
      background: var(--bg3); border: 1px solid var(--border2);
      border-radius: 8px; padding: 8px 12px; transition: border-color .15s;
    }
    .search-box:focus-within { border-color: var(--accent); }
    .search-box svg { color: var(--text3); flex-shrink: 0; }
    .search-box input { flex: 1; font-size: 13px; background: none; border: none; outline: none; color: var(--text); }
    .search-box input::placeholder { color: var(--text3); }
    .grid-ctrl {
      display: flex; align-items: center; gap: 4px;
      background: var(--bg3); border: 1px solid var(--border2);
      border-radius: 8px; padding: 5px 10px; flex-shrink: 0;
    }
    .grid-ctrl span { font-size: 11px; color: var(--text3); font-family: var(--m); min-width: 40px; text-align: center; }
    .grid-btn {
      width: 22px; height: 22px; border-radius: 5px; display: flex;
      align-items: center; justify-content: center;
      background: var(--bg4); color: var(--text3); font-size: 13px; transition: .15s;
    }
    .grid-btn:hover { color: var(--accent2); }

    /* STATS STRIP */
    .stats-strip {
      display: flex; gap: 6px; padding: 0 16px 10px;
      overflow-x: auto; scrollbar-width: none;
    }
    .stats-strip::-webkit-scrollbar { display: none; }
    .stat-chip {
      flex-shrink: 0; background: var(--bg2); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 12px; display: flex; flex-direction: column; gap: 1px;
    }
    .stat-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .6px; font-weight: 700; }
    .stat-val { font-family: var(--m); font-size: 14px; font-weight: 600; }
    .stat-val.green { color: var(--green); }
    .stat-val.yellow { color: var(--yellow); }
    .stat-val.accent { color: var(--accent2); }

    /* SORT + GROUP ROW */
    .sort-row { display: flex; gap: 5px; padding: 0 16px 6px; overflow-x: auto; scrollbar-width: none; align-items: center; }
    .sort-row::-webkit-scrollbar { display: none; }
    .sort-lbl { font-size: 11px; color: var(--text3); font-weight: 700; flex-shrink: 0; }
    .sort-opt {
      flex-shrink: 0; padding: 4px 10px; border-radius: 100px; font-size: 11px; font-weight: 600;
      border: 1px solid var(--border2); color: var(--text3); background: var(--bg3); transition: .15s; cursor: pointer;
    }
    .sort-opt.on { color: var(--accent2); border-color: rgba(91,110,245,.4); background: rgba(91,110,245,.08); }
    .group-row { display: flex; gap: 5px; padding: 0 16px 10px; overflow-x: auto; scrollbar-width: none; align-items: center; }
    .group-row::-webkit-scrollbar { display: none; }
    .group-opt {
      flex-shrink: 0; padding: 4px 10px; border-radius: 100px; font-size: 11px; font-weight: 600;
      border: 1px solid var(--border2); color: var(--text3); background: var(--bg3); transition: .15s; cursor: pointer;
    }
    .group-opt.on { color: var(--purple); border-color: rgba(160,112,240,.4); background: rgba(160,112,240,.08); }

    /* ── SCROLL AREA ── */
    .scroll-area {
      flex: 1; overflow-y: auto; padding: 4px 16px 100px;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    .scroll-area::-webkit-scrollbar { width: 3px; }
    .scroll-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    /* STATES */
    .state-center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; height: 240px; }
    .spinner { width: 24px; height: 24px; border: 2px solid var(--border2); border-top-color: var(--accent2); border-radius: 50%; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* GROUP HEADER (shared by list + gallery) */
    .cat-group { margin-bottom: 18px; }
    .cat-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0 6px; margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--bg); z-index: 2;
    }
    .cat-name { font-size: 12px; font-weight: 800; letter-spacing: .4px; display: flex; align-items: center; gap: 6px; color: var(--text2); }
    .cat-meta { font-family: var(--m); font-size: 11px; color: var(--text3); }
    .cat-sum  { color: var(--green); }

    /* LIST CARD */
    .p-card {
      display: flex; align-items: center; gap: 12px;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 10px; padding: 11px 12px; margin-bottom: 5px;
      cursor: pointer; transition: border-color .15s, transform .1s;
      animation: fadeUp .2s ease both; position: relative; overflow: hidden;
    }
    .p-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; border-radius: 3px 0 0 3px;
    }
    .p-card[data-prio="2"]::before { background: var(--red); }
    .p-card[data-prio="1"]::before { background: var(--yellow); }
    .p-card[data-prio="0"]::before { background: var(--border2); }
    .p-card.done .p-name { text-decoration: line-through; color: var(--text3); }
    .p-card:active { transform: scale(.985); }
    @keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

    .p-thumb {
      width: 48px; height: 48px; border-radius: 8px; flex-shrink: 0;
      background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 20px; overflow: hidden;
    }
    .p-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .p-body { flex: 1; min-width: 0; }
    .p-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-meta-row { display: flex; align-items: center; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
    .p-price { font-family: var(--m); font-size: 12px; font-weight: 600; color: var(--green); }
    .p-source { font-size: 10px; color: var(--text3); font-family: var(--m); }
    .p-variants-badge { font-size: 10px; color: var(--accent2); font-family: var(--m); background: rgba(91,110,245,.1); padding: 1px 6px; border-radius: 100px; }
    .p-status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); flex-shrink: 0; }
    .p-status-dot.ordered { background: var(--yellow); box-shadow: 0 0 5px var(--yellow); }
    .p-status-dot.in_stock { background: var(--green); }
    .p-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
    .p-prio-dot {
      font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 100px; font-family: var(--m);
    }
    .p-prio-dot.p2 { background: rgba(240,80,96,.15); color: var(--red); }
    .p-prio-dot.p1 { background: rgba(240,192,64,.12); color: var(--yellow); }
    .p-prio-dot.p0 { background: var(--bg3); color: var(--text3); }

    /* GALLERY GRID — auto-fill so desktop naturally gets many compact tiles
       instead of a fixed column count blowing up on wide screens. */
    .gal-grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(var(--tile-min, 150px), 1fr)); }
    .gal-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden; cursor: pointer;
      transition: border-color .15s, transform .1s;
      animation: fadeUp .2s ease both; position: relative;
    }
    .gal-card:active { transform: scale(.96); }
    .gal-card[data-prio="2"] .gal-prio-dot { background: var(--red); }
    .gal-card[data-prio="1"] .gal-prio-dot { background: var(--yellow); }
    .gal-img {
      width: 100%; aspect-ratio: 1; background: var(--bg3);
      display: flex; align-items: center; justify-content: center; font-size: 28px;
      overflow: hidden; position: relative;
    }
    .gal-img img { width: 100%; height: 100%; object-fit: cover; }
    .gal-prio-dot {
      position: absolute; top: 6px; right: 6px;
      width: 8px; height: 8px; border-radius: 50%; background: var(--border2);
    }
    .gal-src-badge {
      position: absolute; bottom: 6px; left: 6px;
      font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 100px;
      background: rgba(0,0,0,.6); color: var(--text2); font-family: var(--m);
    }
    .gal-var-badge {
      position: absolute; bottom: 6px; right: 6px;
      font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 100px;
      background: rgba(91,110,245,.75); color: #fff; font-family: var(--m);
    }
    .gal-body { padding: 8px; }
    .gal-name { font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 2px; }
    .gal-price { font-family: var(--m); font-size: 11px; color: var(--green); font-weight: 600; }
    .gal-shop { font-size: 10px; color: var(--text3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* FAB */
    .fab {
      position: fixed; bottom: calc(18px + var(--sb)); right: 16px;
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--accent); color: #fff; font-size: 22px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(91,110,245,.45);
      transition: transform .15s, box-shadow .15s; z-index: 20;
      border: none; cursor: pointer;
    }
    .fab:active { transform: scale(.9); box-shadow: 0 2px 10px rgba(91,110,245,.2); }

    /* OVERLAY + SHEET (shared modal system — forms, detail, analytics, manage lists) */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.75);
      z-index: 100; opacity: 0; pointer-events: none;
      transition: opacity .25s; backdrop-filter: blur(6px);
      display: flex; align-items: flex-end; justify-content: center;
    }
    .overlay.on { opacity: 1; pointer-events: all; }
    .sheet {
      position: relative;
      background: var(--bg2); border-radius: 16px 16px 0 0;
      border: 1px solid var(--border2); border-bottom: none;
      max-height: 94dvh; display: flex; flex-direction: column;
      width: 100%; max-width: 560px;
      transform: translateY(30px); opacity: 0; pointer-events: none; position: fixed; bottom: 0; left: 0; right: 0; margin: 0 auto;
      transition: transform .28s cubic-bezier(.16,1,.3,1), opacity .2s;
    }
    .sheet.on { transform: translateY(0); opacity: 1; pointer-events: all; }
    /* Compact modals (detail card, analytics) — narrower and vertically centered
       on wide screens so they don't stretch edge-to-edge on a laptop. */
    .sheet.sheet-compact { max-width: 440px; }
    @media (min-width: 640px) {
      .sheet { bottom: auto; top: 50%; transform: translateY(calc(-50% + 20px)); border-radius: 16px; border-bottom: 1px solid var(--border2); max-height: 82dvh; }
      .sheet.on { transform: translateY(-50%); }
    }
    .drag-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 4px; margin: 12px auto 0; flex-shrink: 0; }
    @media (min-width: 640px) { .drag-handle { display: none; } }
    .sheet-hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 18px 8px; flex-shrink: 0;
    }
    .sheet-title { font-size: 16px; font-weight: 800; }
    .close-btn {
      width: 28px; height: 28px; border-radius: 7px; background: var(--bg3);
      display: flex; align-items: center; justify-content: center; color: var(--text3); font-size: 15px;
    }
    .sheet-body { overflow-y: auto; padding: 0 18px 24px; flex: 1; }

    /* FORM ELEMENTS */
    .fg { margin-bottom: 13px; }
    .fl { display: block; font-size: 10px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 5px; font-family: var(--m); }
    .fi {
      width: 100%; padding: 10px 12px; background: var(--bg3);
      border: 1px solid var(--border2); border-radius: 8px; font-size: 14px;
      color: var(--text); transition: border-color .15s; box-sizing: border-box;
    }
    .fi:focus { border-color: var(--accent); }
    .fi::placeholder { color: var(--text3); }
    textarea.fi { resize: vertical; min-height: 70px; font-family: var(--f); }
    .frow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* PRIORITY SEL */
    .prio-sel { display: flex; gap: 6px; }
    .prio-opt {
      flex: 1; padding: 8px 4px; border-radius: 8px; text-align: center;
      border: 1px solid var(--border2); background: var(--bg3);
      font-size: 11px; font-weight: 700; font-family: var(--m); color: var(--text3);
      transition: all .15s; cursor: pointer;
    }
    .prio-opt.on-2 { background: rgba(240,80,96,.12); color: var(--red);    border-color: rgba(240,80,96,.4); }
    .prio-opt.on-1 { background: rgba(240,192,64,.10); color: var(--yellow); border-color: rgba(240,192,64,.4); }
    .prio-opt.on-0 { background: var(--bg4); color: var(--text); border-color: var(--border2); }

    /* STATUS SEL */
    .status-sel { display: flex; gap: 6px; }
    .status-opt {
      flex: 1; padding: 8px 4px; border-radius: 8px; text-align: center;
      border: 1px solid var(--border2); background: var(--bg3);
      font-size: 11px; font-weight: 600; color: var(--text3); transition: .15s; cursor: pointer;
    }
    .status-opt.on { background: rgba(91,110,245,.12); color: var(--accent2); border-color: rgba(91,110,245,.4); }

    /* SOURCE BADGES */
    .source-sel { display: flex; gap: 6px; flex-wrap: wrap; }
    .source-opt {
      padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 600;
      border: 1px solid var(--border2); color: var(--text3); background: var(--bg3); cursor: pointer; transition: .15s;
    }
    .source-opt.on { background: rgba(61,214,140,.1); color: var(--green); border-color: rgba(61,214,140,.35); }

    /* TAG INPUT */
    .tags-wrap {
      display: flex; flex-wrap: wrap; gap: 5px; padding: 7px 10px;
      background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px;
      min-height: 40px; cursor: text; transition: border-color .15s;
    }
    .tags-wrap:focus-within { border-color: var(--accent); }
    .tc { display: flex; align-items: center; gap: 3px; padding: 2px 8px 2px 9px; background: rgba(91,110,245,.15); color: var(--accent2); border-radius: 100px; font-size: 11px; font-weight: 600; }
    .tc button { color: var(--accent2); opacity: .6; font-size: 13px; line-height: 1; }
    .tc button:hover { opacity: 1; }
    .tags-wrap input { flex: 1; min-width: 70px; font-size: 13px; background: none; border: none; outline: none; color: var(--text); }
    .tags-wrap input::placeholder { color: var(--text3); }

    /* CAT COMBOBOX */
    .cat-combo { position: relative; }
    .cat-dropdown {
      position: absolute; left: 0; right: 0; top: calc(100% + 4px);
      background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px;
      z-index: 10; max-height: 160px; overflow-y: auto; display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
    }
    .cat-dropdown.open { display: block; }
    .cat-opt {
      padding: 9px 12px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px;
      transition: background .1s;
    }
    .cat-opt:hover { background: var(--bg4); }
    .cat-opt.new-opt { color: var(--green); font-weight: 700; }

    /* SAVE / DEL BTNS */
    .btn-save {
      width: 100%; padding: 13px; background: var(--accent); color: #fff;
      border-radius: 10px; font-size: 14px; font-weight: 800;
      letter-spacing: .3px; transition: transform .1s, background .15s; margin-top: 4px;
      border: none; cursor: pointer;
    }
    .btn-save:hover { background: var(--accent2); }
    .btn-save:active { transform: scale(.98); }
    .btn-save:disabled { opacity: .4; pointer-events: none; }
    .btn-del {
      width: 100%; padding: 11px; border: 1px solid rgba(240,80,96,.25); color: var(--red);
      border-radius: 10px; font-size: 13px; font-weight: 600; transition: background .15s; margin-top: 6px;
      background: none; cursor: pointer;
    }
    .btn-del:hover { background: rgba(240,80,96,.08); }

    /* MANAGE CATEGORIES / SHOPS */
    .manage-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px; margin-bottom: 5px;
    }
    .manage-emoji { font-size: 18px; width: 26px; text-align: center; flex-shrink: 0; }
    .manage-name  { flex: 1; font-size: 13px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .manage-sub   { font-size: 11px; color: var(--text3); }
    .manage-del   { color: var(--text3); font-size: 17px; padding: 2px 6px; transition: color .15s; background: none; border: none; cursor: pointer; }
    .manage-del:hover { color: var(--red); }
    .add-cat-row  { display: flex; gap: 7px; margin-top: 10px; }
    .add-cat-row input { flex: 1; }
    .emoji-in { width: 55px; text-align: center; }
    .btn-add-sm {
      padding: 9px 14px; background: var(--bg3); border: 1px solid var(--border2);
      border-radius: 8px; font-size: 12px; font-weight: 700; color: var(--green); flex-shrink: 0; transition: background .15s;
      cursor: pointer;
    }
    .btn-add-sm:hover { background: var(--bg4); }

    /* SOURCE FILTER PILLS */
    .source-filter-row {
      display: flex; gap: 5px; padding: 0 16px 8px; overflow-x: auto; scrollbar-width: none;
    }
    .source-filter-row::-webkit-scrollbar { display: none; }
    .src-pill {
      flex-shrink: 0; padding: 4px 10px; border-radius: 100px; font-size: 11px;
      font-weight: 600; border: 1px solid var(--border2); color: var(--text3);
      background: var(--bg3); transition: .15s; cursor: pointer;
    }
    .src-pill.on { color: var(--green); border-color: rgba(61,214,140,.35); background: rgba(61,214,140,.08); }

    /* DETAIL MODAL CONTENT */
    .detail-hero {
      width: 100%; height: 160px; border-radius: 10px; overflow: hidden;
      background: var(--bg3); display: flex; align-items: center; justify-content: center;
      font-size: 46px; margin-bottom: 12px; position: relative;
    }
    .detail-hero img { width: 100%; height: 100%; object-fit: cover; }
    .detail-name { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
    .detail-meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 14px; }
    .dmeta { background: var(--bg3); border-radius: 8px; padding: 9px 11px; }
    .dmeta-lbl { font-size: 10px; color: var(--text3); font-weight: 700; letter-spacing: .6px; text-transform: uppercase; margin-bottom: 2px; }
    .dmeta-val { font-size: 13px; font-weight: 700; }
    .detail-notes { font-size: 13px; color: var(--text2); line-height: 1.6; padding: 10px; background: var(--bg3); border-radius: 8px; margin-bottom: 12px; }
    .detail-actions { display: flex; gap: 8px; padding: 12px 18px 18px; flex-shrink: 0; }

    /* DETAIL VARIANTS LIST — also acts as the variant picker: click a row to
       make it the active/primary variant shown on the card & hero image. */
    .dvar-section-title { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--text3); margin: 4px 0 8px; }
    .dvar-row {
      display: flex; align-items: center; gap: 10px; padding: 9px 10px;
      background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px; margin-bottom: 6px;
      cursor: pointer; transition: border-color .15s;
    }
    .dvar-row:hover { border-color: var(--border2); }
    .dvar-row.primary { border-color: var(--purple); background: rgba(160,112,240,.06); }
    .dvar-thumb { width: 34px; height: 34px; border-radius: 6px; background: var(--bg4); flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .dvar-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .dvar-star { font-size: 14px; color: var(--text3); flex-shrink: 0; }
    .dvar-row.primary .dvar-star { color: var(--yellow); }
    .dvar-body { flex: 1; min-width: 0; }
    .dvar-title { font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dvar-meta { font-size: 11px; color: var(--text3); margin-top: 2px; display: flex; gap: 6px; flex-wrap: wrap; }
    .dvar-price { font-family: var(--m); font-size: 13px; font-weight: 700; color: var(--green); flex-shrink: 0; }
    .dvar-link { color: var(--accent2); }
    .dvar-hint { font-size: 11px; color: var(--text3); margin: -2px 0 8px; }

    /* ANALYTICS */
    .an-section { padding: 0 0 16px; }
    .an-section-title { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; }
    .an-bar-row { margin-bottom: 10px; }
    .an-bar-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
    .an-bar-track { height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
    .an-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 3px; transition: width .4s; }
    .an-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .an-stat { background: var(--bg3); border: 1px solid var(--border2); border-radius: 10px; padding: 12px 14px; }
    .an-stat-val { font-family: var(--m); font-size: 18px; font-weight: 700; }
    .an-stat-lbl { font-size: 11px; color: var(--text3); margin-top: 2px; }
    .an-stat.green .an-stat-val { color: var(--green); }
    .an-stat.yellow .an-stat-val { color: var(--yellow); }
    .an-stat.accent .an-stat-val { color: var(--accent2); }
    .an-stat.red .an-stat-val { color: var(--red); }

    /* ── VARIANTS EDITOR (in add/edit form) — each variant carries its own photo ── */
    .vars-editor { display: flex; flex-direction: column; gap: 8px; margin-top: 5px; }
    .var-row { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px; position: relative; }
    .var-row.pref { border-color: var(--purple); }
    .var-thumb {
      width: 52px; height: 52px; border-radius: 8px; flex-shrink: 0;
      background: var(--bg4); border: 1px dashed var(--border2);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: var(--text3); overflow: hidden; position: relative; cursor: pointer;
    }
    .var-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .var-thumb input[type=file] { display: none; }
    .var-fields { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .var-fields-row { display: flex; gap: 6px; }
    .var-fields input, .var-fields select { font-size: 13px; background: var(--bg4); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border2); color: var(--text); width: 100%; box-sizing: border-box; }
    .var-fields input:focus, .var-fields select:focus { border-color: var(--accent); outline: none; }
    .var-fields input::placeholder { color: var(--text3); }
    .var-right { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; flex-shrink: 0; padding-top: 2px; }
    .star-btn { font-size: 18px; opacity: .35; transition: opacity .15s; cursor: pointer; background: none; border: none; padding: 4px; }
    .star-btn.on { opacity: 1; color: var(--yellow); }
    .del-var { font-size: 18px; color: var(--text3); cursor: pointer; transition: color .15s; background: none; border: none; padding: 4px; }
    .del-var:hover { color: var(--red); }
    .btn-add-var {
      width: 100%; padding: 10px; border: 1.5px dashed var(--border2); border-radius: 8px;
      font-size: 13px; font-weight: 600; color: var(--text3); background: none; cursor: pointer; transition: all .15s;
    }
    .btn-add-var:hover { border-color: var(--accent); color: var(--accent2); }
    .vars-empty-hint { font-size: 12px; color: var(--text3); padding: 4px 2px 8px; }

    /* Wider viewport polish */
    @media (min-width: 900px) {
      #app { max-width: 1100px; margin: 0 auto; }
      body { overflow-y: auto; }
    }
  </style>

<!-- SCRIPTS -->
<script src="../core/db.js"></script>
<script src="../core/ui.js"></script>
<script>
'use strict';

// ══════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════
let items       = [];   // purchases
let variants    = [];   // ALL purchase_variants (filtered per-item in helpers below)
let categories  = [];
let shops       = [];
let filterStatus  = 'all';
let filterSource  = 'all';
let searchQ       = '';
let sortMode      = 'priority';
let groupMode     = 'category';  // 'none' | 'category' | 'tags'
let viewMode      = 'gallery';
let tileMin       = 150;   // px — gallery tile min width; auto-fill grid derives column count from this
let editId        = null;
let curTags       = [];
let curPriority   = 1;
let curStatus     = 'wish';
let curSource     = 'manual';
let detailId      = null;
let activeSheet   = null;
let formVariants  = [];     // [{ id|null, title, price, shopId, url, notes, isPrimary, imageIds, _imgData }]
let removedVariantIds = []; // variant ids deleted while editing, to remove from DB on save

const $  = id => document.getElementById(id);
const loadingEl = $('loadingEl');
const mainList  = $('mainList');
const emptyEl   = $('emptyEl');

// ══════════════════════════════════════════════════
// LOAD
// ══════════════════════════════════════════════════
async function loadItems() {
  items = await DB.getAll('purchases');
}
async function loadVariants() {
  variants = await DB.getAll('purchase_variants');
}
async function loadShops() {
  shops = await DB.getAll('shops');
}

function variantsOf(purchaseId) {
  return variants
    .filter(v => v.purchaseId === purchaseId)
    .sort((a, b) => (b.isPrimary ? 1 : 0) - (a.isPrimary ? 1 : 0) || new Date(a.createdAt) - new Date(b.createdAt));
}

// Primary (= currently displayed) variant for an item, with a fallback to
// legacy flat price/store/imageIds for purchases created before the
// variants model existed (photo & price used to live on the purchase itself).
function primaryVariantOf(item) {
  const vs = variantsOf(item.id);
  const primary = vs.find(v => v.isPrimary) || vs[0];
  if (primary) return primary;
  if (item.price != null || item.store || (item.imageIds && item.imageIds.length)) {
    return {
      title: null, price: item.price ?? null, shopId: null, url: item.url || null,
      notes: null, imageIds: item.imageIds || [], _legacy: true, _legacyStore: item.store || null,
    };
  }
  return null;
}

function shopName(shopId) { const s = shops.find(s => s.id === shopId); return s ? s.name : null; }
function shopLogo(shopId) { const s = shops.find(s => s.id === shopId); return s ? (s.logo || '🛍️') : '🛍️'; }

async function loadCategories() {
  const all = await DB.getAll('categories').catch(() => []);
  categories = all.filter(c => !c.module || c.module === 'purchases');
  if (categories.length === 0) {
    const defaults = [
      { name: 'Техника', emoji: '💻' }, { name: 'Одежда', emoji: '👗' },
      { name: 'Кухня', emoji: '🍳' },   { name: 'Косплей', emoji: '🎭' },
      { name: 'Красота', emoji: '💅' },  { name: 'Дом', emoji: '🏠' },
      { name: 'Спорт', emoji: '🏋️' },   { name: 'Книги', emoji: '📚' },
    ];
    for (const d of defaults) {
      const rec = await DB.create('categories', { ...d, module: 'purchases' });
      categories.push(rec);
    }
  }
}
async function addCategory(name, emoji) {
  const rec = await DB.create('categories', { name, emoji, module: 'purchases' });
  categories.push(rec);
  return rec;
}
async function deleteCategory(id) {
  await DB.delete('categories', id);
  categories = categories.filter(c => c.id !== id);
}

// ══════════════════════════════════════════════════
// RENDER — LIST/GALLERY
// ══════════════════════════════════════════════════
function fmtPrice(n) {
  if (n == null || n === '') return '—';
  return Number(n).toLocaleString('ru-RU') + ' ₽';
}
function priceOf(item) {
  const pv = primaryVariantOf(item);
  return pv ? (pv.price ?? null) : null;
}

function getVisible() {
  let list = [...items];
  if (filterStatus !== 'all') list = list.filter(i => i.status === filterStatus);
  if (filterSource !== 'all') list = list.filter(i => (i.sourceType || 'manual') === filterSource);
  if (searchQ) {
    const q = searchQ.toLowerCase();
    list = list.filter(i => {
      const vs = variantsOf(i.id);
      const varHay = vs.map(v => `${v.title||''} ${shopName(v.shopId)||''}`).join(' ').toLowerCase();
      return (i.name||'').toLowerCase().includes(q) ||
        (i.category||'').toLowerCase().includes(q) ||
        (i.tags||[]).some(t => t.toLowerCase().includes(q)) ||
        varHay.includes(q);
    });
  }
  switch (sortMode) {
    case 'price_asc':  list.sort((a,b) => (priceOf(a)||0)-(priceOf(b)||0)); break;
    case 'price_desc': list.sort((a,b) => (priceOf(b)||0)-(priceOf(a)||0)); break;
    case 'date':       list.sort((a,b) => new Date(b.createdAt)-new Date(a.createdAt)); break;
    default:           list.sort((a,b) => (b.priority||0)-(a.priority||0)); break;
  }
  return list;
}

// Groups a list of items according to groupMode. Returns an array of
// { key, label, emoji, sum, items } — in 'tags' mode an item with several
// tags appears once per tag group (items with no tags land in "Без тегов").
function groupItems(list) {
  if (groupMode === 'none') {
    return [{ key: '_all', label: null, emoji: null, items: list }];
  }
  if (groupMode === 'tags') {
    const map = {};
    list.forEach(item => {
      const tags = (item.tags && item.tags.length) ? item.tags : ['Без тегов'];
      tags.forEach(t => { (map[t] = map[t] || []).push(item); });
    });
    return Object.entries(map)
      .sort((a,b) => a[0]==='Без тегов' ? 1 : b[0]==='Без тегов' ? -1 : b[1].length - a[1].length)
      .map(([tag, its]) => ({ key: tag, label: tag, emoji: '🏷', items: its }));
  }
  // category
  const map = {};
  list.forEach(item => { const c = item.category || 'Без категории'; (map[c] = map[c] || []).push(item); });
  return Object.entries(map).map(([cat, its]) => {
    const catObj = categories.find(c => c.name === cat);
    return { key: cat, label: cat, emoji: catObj ? catObj.emoji : '📦', items: its };
  });
}

function render() {
  loadingEl.style.display = 'none';
  const list = getVisible();

  const notDone = items.filter(i => i.status !== 'in_stock');
  $('stTotal').textContent = items.length;
  $('stSum').textContent   = notDone.length ? fmtPrice(notDone.reduce((s,i) => s + (priceOf(i)||0), 0)) : '—';
  $('stDone').textContent  = items.filter(i => i.status === 'in_stock').length;
  $('stLeft').textContent  = notDone.length;

  if (list.length === 0) {
    mainList.style.display = 'none';
    emptyEl.style.display  = 'flex';
    return;
  }
  emptyEl.style.display  = 'none';
  mainList.style.display = 'block';

  const groups = groupItems(list);
  if (viewMode === 'gallery') renderGallery(groups);
  else renderList(groups);
}

function srcLabel(src) {
  const map = { manual: '', task: 'Задача', project: 'Проект', cosplay: 'Косплей', wishlist: 'Вишлист', meal_plan: 'Питание' };
  return map[src] || '';
}

// Photo now belongs to the variant (primary variant of the item), with a
// legacy fallback to the purchase's own imageIds for pre-migration records.
async function thumbHTML(item) {
  const pv = primaryVariantOf(item);
  const imgIds = pv && pv.imageIds && pv.imageIds.length ? pv.imageIds : null;
  if (imgIds) {
    const img = await DB.getImage(imgIds[0]);
    if (img) return `<img src="${img.data}" loading="lazy"/>`;
  }
  const catEmojis = { 'Техника':'💻','Одежда':'👗','Кухня':'🍳','Косплей':'🎭','Красота':'💅','Дом':'🏠','Спорт':'🏋️','Книги':'📚' };
  return catEmojis[item.category] || '🛍️';
}

function groupHeaderHtml(g, sumFn) {
  if (g.label == null) return '';
  const sum = sumFn(g.items);
  return `<div class="cat-header">
    <div class="cat-name">${g.emoji ? g.emoji + ' ' : ''}${esc(g.label)}</div>
    <div class="cat-meta">${g.items.length} шт · <span class="cat-sum">${fmtPrice(sum)}</span></div>
  </div>`;
}
function groupSum(its) { return its.filter(i => i.status !== 'in_stock').reduce((s,i) => s+(priceOf(i)||0), 0); }

async function renderGallery(groups) {
  mainList.innerHTML = '';
  for (const g of groups) {
    const wrap = document.createElement('div');
    wrap.className = 'cat-group';
    wrap.innerHTML = groupHeaderHtml(g, groupSum) + `<div class="gal-grid" style="--tile-min:${tileMin}px"></div>`;
    const grid = wrap.querySelector('.gal-grid');
    for (let idx = 0; idx < g.items.length; idx++) {
      const item = g.items[idx];
      const el = document.createElement('div');
      el.className = 'gal-card';
      el.dataset.prio = item.priority ?? 1;
      el.dataset.id   = item.id;
      el.style.animationDelay = `${idx * 0.02}s`;
      const src = srcLabel(item.sourceType);
      const th  = await thumbHTML(item);
      const pv  = primaryVariantOf(item);
      const vCount = variantsOf(item.id).length;
      el.innerHTML = `
        <div class="gal-img">
          ${th}
          <div class="gal-prio-dot"></div>
          ${src ? `<div class="gal-src-badge">${src}</div>` : ''}
          ${vCount > 1 ? `<div class="gal-var-badge">${vCount}</div>` : ''}
        </div>
        <div class="gal-body">
          <div class="gal-name">${esc(item.name)}</div>
          ${pv && pv.price != null ? `<div class="gal-price">${fmtPrice(pv.price)}</div>` : ''}
          ${pv && pv.shopId ? `<div class="gal-shop">${esc(shopName(pv.shopId) || '')}</div>` : ''}
        </div>`;
      el.addEventListener('click', () => openDetail(item.id));
      grid.appendChild(el);
    }
    mainList.appendChild(wrap);
  }
}

async function renderList(groups) {
  mainList.innerHTML = '';
  for (const g of groups) {
    const wrap = document.createElement('div');
    wrap.className = 'cat-group';
    let cardsHtml = '';
    for (let idx = 0; idx < g.items.length; idx++) {
      const item = g.items[idx];
      const p = item.priority ?? 1;
      const pLabel = p===2 ? ['p2','🔴'] : p===1 ? ['p1','📅'] : ['p0','○'];
      const dotCls = item.status==='ordered' ? 'ordered' : item.status==='in_stock' ? 'in_stock' : '';
      const th = await thumbHTML(item);
      const src = srcLabel(item.sourceType);
      const pv = primaryVariantOf(item);
      const vs = variantsOf(item.id);
      cardsHtml += `<div class="p-card ${item.status==='in_stock'?'done':''}" data-prio="${p}" data-id="${item.id}" style="animation-delay:${idx*0.025}s">
        <div class="p-thumb">${th}</div>
        <div class="p-body">
          <div class="p-name">${esc(item.name)}</div>
          <div class="p-meta-row">
            ${pv && pv.price != null ? `<span class="p-price">${fmtPrice(pv.price)}</span>` : ''}
            <span class="p-status-dot ${dotCls}"></span>
            ${src ? `<span class="p-source">${src}</span>` : ''}
            ${pv && (pv.shopId ? shopName(pv.shopId) : pv._legacyStore) ? `<span class="p-source">@ ${esc(pv.shopId ? shopName(pv.shopId) : pv._legacyStore)}</span>` : ''}
            ${vs.length > 1 ? `<span class="p-variants-badge">${vs.length} варианта</span>` : ''}
          </div>
          ${(item.tags||[]).length ? `<div style="display:flex;gap:3px;flex-wrap:wrap;margin-top:4px">${(item.tags||[]).map(t=>`<span style="padding:1px 7px;border-radius:100px;font-size:10px;background:var(--bg3);color:var(--text3)">${esc(t)}</span>`).join('')}</div>` : ''}
        </div>
        <div class="p-right">
          <span class="p-prio-dot ${pLabel[0]}">${pLabel[1]}</span>
        </div>
      </div>`;
    }
    wrap.innerHTML = groupHeaderHtml(g, groupSum) + cardsHtml;
    wrap.querySelectorAll('[data-id]').forEach(el => el.addEventListener('click', () => openDetail(el.dataset.id)));
    mainList.appendChild(wrap);
  }
}

// ══════════════════════════════════════════════════
// DETAIL MODAL (compact "карточка покупки" + variant picker)
// ══════════════════════════════════════════════════
async function openDetail(id) {
  detailId = id;
  await renderDetail();
  openSheet('detail');
}

async function renderDetail() {
  const item = items.find(i => i.id === detailId);
  if (!item) return;

  const pv = primaryVariantOf(item);
  const th = await thumbHTML(item);
  const hasImg = pv && pv.imageIds && pv.imageIds.length;

  const statusMap = { wish:'Хочу', ordered:'Заказано', in_stock:'Куплено' };
  const prioMap   = { 2:'🔴 Срочно', 1:'📅 Планово', 0:'○ Обычный' };
  const srcMap    = { manual:'✋ Ручной', task:'📋 Задача', project:'📁 Проект', cosplay:'🎭 Косплей', wishlist:'💛 Вишлист', meal_plan:'🍽 Питание' };

  const vs = variantsOf(item.id);
  let varsHtml;
  if (vs.length) {
    const rows = await Promise.all(vs.map(async v => {
      let thumb = '🛍️';
      if (v.imageIds && v.imageIds.length) {
        const img = await DB.getImage(v.imageIds[0]);
        if (img) thumb = `<img src="${img.data}"/>`;
      }
      return `
      <div class="dvar-row ${v.isPrimary ? 'primary' : ''}" data-vid="${v.id}">
        <div class="dvar-thumb">${thumb}</div>
        <span class="dvar-star">${v.isPrimary ? '★' : '☆'}</span>
        <div class="dvar-body">
          <div class="dvar-title">${esc(v.title || 'Без названия')}</div>
          <div class="dvar-meta">
            ${v.shopId ? `<span>${shopLogo(v.shopId)} ${esc(shopName(v.shopId) || '')}</span>` : '<span>магазин не выбран</span>'}
            ${v.url ? `<a class="dvar-link" href="${esc(v.url)}" target="_blank" onclick="event.stopPropagation()">🔗 ссылка</a>` : ''}
          </div>
          ${v.notes ? `<div style="font-size:11px;color:var(--text3);margin-top:3px">${esc(v.notes)}</div>` : ''}
        </div>
        <div class="dvar-price">${fmtPrice(v.price)}</div>
      </div>`;
    }));
    varsHtml = `
      <div class="dvar-section-title">Варианты (${vs.length})</div>
      ${vs.length > 1 ? `<div class="dvar-hint">Нажми на вариант, чтобы показать его на карточке</div>` : ''}
      ${rows.join('')}`;
  } else {
    varsHtml = `<div class="dvar-section-title">Варианты</div><div style="font-size:12px;color:var(--text3)">Пока нет ни одного варианта — нажми ✏️, чтобы добавить.</div>`;
  }

  $('detailBody').innerHTML = `
    <div class="detail-hero">${hasImg ? th : `<span style="font-size:56px">${th}</span>`}</div>
    <div class="detail-name">${esc(item.name)}</div>
    ${(item.tags||[]).length ? `<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px">${(item.tags||[]).map(t=>`<span class="badge b-tag">${esc(t)}</span>`).join('')}</div>` : ''}
    <div class="detail-meta-grid">
      <div class="dmeta"><div class="dmeta-lbl">Статус</div><div class="dmeta-val">${statusMap[item.status]||item.status}</div></div>
      <div class="dmeta"><div class="dmeta-lbl">Приоритет</div><div class="dmeta-val">${prioMap[item.priority??1]}</div></div>
      <div class="dmeta"><div class="dmeta-lbl">Источник</div><div class="dmeta-val">${srcMap[item.sourceType||'manual']}</div></div>
      ${item.category ? `<div class="dmeta"><div class="dmeta-lbl">Категория</div><div class="dmeta-val">${esc(item.category)}</div></div>` : ''}
    </div>
    ${varsHtml}
    ${item.notes ? `<div class="detail-notes" style="margin-top:12px">${esc(item.notes)}</div>` : ''}
    <div style="font-size:11px;color:var(--text3);font-family:var(--m);margin-top:12px">Добавлено: ${UI.date(item.createdAt)}</div>
  `;

  // Variant picker: click any row (outside the link) to make it primary.
  $('detailBody').querySelectorAll('.dvar-row').forEach(row => {
    row.addEventListener('click', async () => {
      if (vs.length < 2) return;
      await DB.setPrimaryVariant(item.id, row.dataset.vid);
      await loadVariants();
      await renderDetail();
      render();
    });
  });
}

$('detailClose').addEventListener('click', closeSheets);
$('detailEdit').addEventListener('click', () => { closeSheets(); openEdit(detailId); });
$('detailDelBtn').addEventListener('click', async () => {
  if (!confirm('Удалить эту покупку и все её варианты?')) return;
  for (const v of variantsOf(detailId)) await DB.delete('purchase_variants', v.id);
  await DB.delete('purchases', detailId);
  closeSheets();
  await loadItems(); await loadVariants(); render();
  UI.toast('Удалено', 'ok');
});
$('detailStatusBtn').addEventListener('click', async () => {
  const item = items.find(i => i.id === detailId);
  if (!item) return;
  const cycle = { wish: 'ordered', ordered: 'in_stock', in_stock: 'wish' };
  const next = cycle[item.status] || 'wish';
  await DB.update('purchases', detailId, { status: next });
  await loadItems(); render();
  await renderDetail();
  const label = { wish:'Хочу', ordered:'Заказано', in_stock:'Куплено' };
  UI.toast('Статус: ' + label[next], 'ok');
});

async function openAnalytics() {
  const body = $('analyticsBody');
  body.innerHTML = '<div class="state-center"><div class="spinner"></div></div>';
  openSheet('analytics');

  const all = await DB.getAll('purchases');
  const total   = all.length;
  const bought  = all.filter(i => i.status === 'in_stock');
  const pending = all.filter(i => i.status !== 'in_stock');
  const totalSpend   = bought.reduce((s,i) => s+(priceOf(i)||0), 0);
  const plannedSpend = pending.reduce((s,i) => s+(priceOf(i)||0), 0);

  const byCat = {};
  all.forEach(i => { const c = i.category||'Без категории'; byCat[c] = (byCat[c]||0) + (priceOf(i)||0); });
  const catEntries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxCat = catEntries[0]?.[1] || 1;

  const bySrc = {};
  all.forEach(i => { const s = i.sourceType||'manual'; bySrc[s] = (bySrc[s]||0) + 1; });

  const convRate  = total ? Math.round(bought.length / total * 100) : 0;

  body.innerHTML = `
    <div class="an-section">
      <div class="an-section-title">Общая статистика</div>
      <div class="an-stat-grid">
        <div class="an-stat accent"><div class="an-stat-val">${total}</div><div class="an-stat-lbl">всего позиций</div></div>
        <div class="an-stat green"><div class="an-stat-val">${fmtPrice(totalSpend)}</div><div class="an-stat-lbl">потрачено</div></div>
        <div class="an-stat yellow"><div class="an-stat-val">${fmtPrice(plannedSpend)}</div><div class="an-stat-lbl">запланировано</div></div>
        <div class="an-stat red"><div class="an-stat-val">${convRate}%</div><div class="an-stat-lbl">куплено от списка</div></div>
      </div>
    </div>
    <div class="an-section">
      <div class="an-section-title">По категориям</div>
      ${catEntries.slice(0, 8).map(([name, sum]) => `
        <div class="an-bar-row">
          <div class="an-bar-label"><span style="font-size:12px">${esc(name)}</span><span style="font-size:11px;color:var(--text3);font-family:var(--m)">${fmtPrice(sum)}</span></div>
          <div class="an-bar-track"><div class="an-bar-fill" style="width:${Math.round(sum/maxCat*100)}%"></div></div>
        </div>`).join('')}
    </div>
    <div class="an-section">
      <div class="an-section-title">По источникам</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${Object.entries(bySrc).map(([src, cnt]) => {
          const srcNames = { manual:'✋ Ручные', task:'📋 Из задач', project:'📁 Проекты', cosplay:'🎭 Косплей', wishlist:'💛 Вишлист', meal_plan:'🍽 Питание' };
          return `<div style="display:flex;justify-content:space-between;padding:9px 12px;background:var(--bg3);border-radius:8px;font-size:13px">
            <span>${srcNames[src]||src}</span><span style="font-family:var(--m);color:var(--accent2)">${cnt}</span>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

function shopOptionsHtml(selectedId) {
  return `<option value="">— магазин не выбран —</option>` +
    shops.map(s => `<option value="${s.id}" ${s.id===selectedId?'selected':''}>${esc(s.logo||'🛍️')} ${esc(s.name)}</option>`).join('');
}

function renderVarsEditor() {
  const el = $('fVarsEditor');
  $('varsEmptyHint').style.display = formVariants.length ? 'none' : 'block';
  el.innerHTML = formVariants.map((v, idx) => {
    const thumbSrc = v._imgData || v._imgPreview || null;
    return `
    <div class="var-row ${v.isPrimary ? 'pref' : ''}" data-idx="${idx}">
      <div class="var-thumb" title="Фото варианта">
        ${thumbSrc ? `<img src="${thumbSrc}"/>` : '📷'}
        <input type="file" class="v-img-input" accept="image/*"/>
      </div>
      <div class="var-fields">
        <input type="text" class="v-title" placeholder="Бренд / точное название" value="${esc(v.title||'')}"/>
        <div class="var-fields-row">
          <input type="number" class="v-price" placeholder="Цена" value="${v.price ?? ''}" style="max-width:110px"/>
          <select class="v-shop">${shopOptionsHtml(v.shopId)}</select>
        </div>
        <input type="url" class="v-url" placeholder="Ссылка (необязательно)" value="${esc(v.url||'')}"/>
        <input type="text" class="v-notes" placeholder="Комментарий" value="${esc(v.notes||'')}"/>
      </div>
      <div class="var-right">
        <button type="button" class="star-btn ${v.isPrimary?'on':''}" title="Показывать этот вариант на карточке">★</button>
        <button type="button" class="del-var" title="Удалить вариант">✕</button>
      </div>
    </div>`;
  }).join('');

  el.querySelectorAll('.var-row').forEach(row => {
    const idx = +row.dataset.idx;
    row.querySelector('.v-title').addEventListener('input', e => formVariants[idx].title = e.target.value);
    row.querySelector('.v-price').addEventListener('input', e => formVariants[idx].price = e.target.value === '' ? null : Number(e.target.value));
    row.querySelector('.v-shop').addEventListener('change', e => formVariants[idx].shopId = e.target.value || null);
    row.querySelector('.v-url').addEventListener('input', e => formVariants[idx].url = e.target.value);
    row.querySelector('.v-notes').addEventListener('input', e => formVariants[idx].notes = e.target.value);
    row.querySelector('.star-btn').addEventListener('click', () => {
      formVariants.forEach((v, i) => v.isPrimary = (i === idx));
      renderVarsEditor();
    });
    row.querySelector('.del-var').addEventListener('click', () => {
      const removed = formVariants.splice(idx, 1)[0];
      if (removed && removed.id) removedVariantIds.push(removed.id);
      if (removed && removed.isPrimary && formVariants.length) formVariants[0].isPrimary = true;
      renderVarsEditor();
    });
    const thumb = row.querySelector('.var-thumb');
    const fileInput = row.querySelector('.v-img-input');
    thumb.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = ev => {
        formVariants[idx]._imgData = ev.target.result; // pending upload, saved on Submit
        renderVarsEditor();
      };
      r.readAsDataURL(f);
    });
  });
}

function resetForm() {
  editId = null;
  curTags = []; curPriority = 1; curStatus = 'wish'; curSource = 'manual';
  formVariants = []; removedVariantIds = [];
  $('fName').value = '';
  $('fCat').value  = '';
  $('fNotes').value = '';
  $('tagIn').value = '';
  renderTagChips(); syncPrioBtns(); syncStatusBtns(); syncSourceBtns(); renderVarsEditor();
  $('formTitle').textContent = 'Новая покупка';
  $('btnDel').style.display = 'none';
}

function openAdd() { resetForm(); openSheet('form'); }

async function openEdit(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  resetForm();
  editId     = id;
  curTags    = [...(item.tags||[])];
  curPriority = item.priority ?? 1;
  curStatus   = item.status   || 'wish';
  curSource   = item.sourceType || 'manual';

  $('fName').value  = item.name  || '';
  $('fCat').value   = item.category || '';
  $('fNotes').value = item.notes || '';

  // Load existing variants; if none exist but legacy flat price/store/photo
  // are present on the purchase itself, seed one variant from them so
  // editing migrates old records into the new model transparently.
  const existing = variantsOf(id);
  if (existing.length) {
    formVariants = existing.map(v => ({ ...v, imageIds: v.imageIds || [] }));
  } else if (item.price != null || item.store || item.url || (item.imageIds && item.imageIds.length)) {
    formVariants = [{
      id: null, title: null, price: item.price ?? null,
      shopId: null, url: item.url || null,
      notes: item.store ? `Магазин (из старых данных): ${item.store}` : null,
      isPrimary: true, imageIds: item.imageIds || [],
    }];
  }

  // Preload existing photo previews (already-saved imageIds) for each variant.
  for (const v of formVariants) {
    if (v.imageIds && v.imageIds.length && !v._imgData) {
      const img = await DB.getImage(v.imageIds[0]);
      if (img) v._imgPreview = img.data;
    }
  }
  renderVarsEditor();

  renderTagChips(); syncPrioBtns(); syncStatusBtns(); syncSourceBtns();
  $('formTitle').textContent = 'Редактировать';
  $('btnDel').style.display = 'block';
  openSheet('form');
}

$('btnSave').addEventListener('click', async () => {
  const name = $('fName').value.trim();
  if (!name) { UI.toast('Введи название', 'err'); return; }
  const btn = $('btnSave');
  btn.disabled = true; btn.textContent = 'Сохранение...';
  try {
    const catVal = $('fCat').value.trim();
    if (catVal && !categories.find(c => c.name === catVal)) {
      await addCategory(catVal, '📦');
    }

    const payload = {
      name,
      category:   catVal || null,
      notes:      $('fNotes').value.trim() || null,
      tags:       curTags,
      priority:   curPriority,
      status:     curStatus,
      sourceType: curSource,
    };

    let purchaseId = editId;
    if (editId) {
      await DB.update('purchases', editId, payload);
    } else {
      const rec = await DB.create('purchases', payload);
      purchaseId = rec.id;
    }

    for (const vid of removedVariantIds) {
      await DB.delete('purchase_variants', vid);
    }

    if (formVariants.length && !formVariants.some(v => v.isPrimary)) {
      formVariants[0].isPrimary = true;
    }

    for (const v of formVariants) {
      let imageIds = v.imageIds || [];
      if (v._imgData) {
        const newId = await DB.saveImage(v._imgData, { name: 'variant-photo' });
        imageIds = [newId];
      }
      const varPayload = {
        purchaseId,
        title:  v.title?.trim() || null,
        price:  v.price != null && v.price !== '' ? Number(v.price) : null,
        shopId: v.shopId || null,
        url:    v.url?.trim() || null,
        notes:  v.notes?.trim() || null,
        isPrimary: !!v.isPrimary,
        imageIds,
      };
      if (v.id) await DB.update('purchase_variants', v.id, varPayload);
      else      await DB.create('purchase_variants', varPayload);
    }

    await loadItems(); await loadVariants(); render(); closeSheets();
    UI.toast(editId ? 'Обновлено ✓' : 'Добавлено ✓', 'ok');
  } catch(e) {
    UI.toast('Ошибка: ' + e.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = 'Сохранить';
  }
});

$('btnDel').addEventListener('click', async () => {
  if (!editId || !confirm('Удалить эту покупку и все её варианты?')) return;
  for (const v of variantsOf(editId)) await DB.delete('purchase_variants', v.id);
  await DB.delete('purchases', editId);
  items = items.filter(i => i.id !== editId);
  await loadVariants();
  render(); closeSheets(); UI.toast('Удалено', 'ok');
});

// Priority buttons
document.querySelectorAll('.prio-opt').forEach(btn => {
  btn.addEventListener('click', () => { curPriority = +btn.dataset.p; syncPrioBtns(); });
});
function syncPrioBtns() {
  document.querySelectorAll('.prio-opt').forEach(btn => {
    btn.className = 'prio-opt';
    if (+btn.dataset.p === curPriority) btn.classList.add(`on-${curPriority}`);
  });
}

// Status buttons
document.querySelectorAll('.status-opt').forEach(btn => {
  btn.addEventListener('click', () => { curStatus = btn.dataset.sv; syncStatusBtns(); });
});
function syncStatusBtns() {
  document.querySelectorAll('.status-opt').forEach(btn => btn.classList.toggle('on', btn.dataset.sv === curStatus));
}

// Source buttons
document.querySelectorAll('.source-opt').forEach(btn => {
  btn.addEventListener('click', () => { curSource = btn.dataset.src; syncSourceBtns(); });
});
function syncSourceBtns() {
  document.querySelectorAll('.source-opt').forEach(btn => btn.classList.toggle('on', btn.dataset.src === curSource));
}

// Tags
const tagIn = $('tagIn');
tagIn.addEventListener('keydown', e => {
  if (e.key==='Enter'||e.key===',') { e.preventDefault(); addTag(tagIn.value.trim()); }
  if (e.key==='Backspace'&&!tagIn.value&&curTags.length) { curTags.pop(); renderTagChips(); }
});
tagIn.addEventListener('blur', () => { if(tagIn.value.trim()) addTag(tagIn.value.trim()); });
$('tagsWrap').addEventListener('click', () => tagIn.focus());
function addTag(v) {
  if (!v || curTags.includes(v)) { tagIn.value=''; return; }
  curTags.push(v); tagIn.value=''; renderTagChips();
}
function renderTagChips() {
  $('tagsWrap').querySelectorAll('.tc').forEach(el => el.remove());
  curTags.forEach((t, i) => {
    const chip = document.createElement('span');
    chip.className = 'tc';
    chip.innerHTML = `${esc(t)}<button data-i="${i}">×</button>`;
    chip.querySelector('button').addEventListener('click', () => { curTags.splice(i, 1); renderTagChips(); });
    $('tagsWrap').insertBefore(chip, tagIn);
  });
}

// Category combobox
$('fCat').addEventListener('input', () => renderCatDropdown($('fCat').value));
$('fCat').addEventListener('focus', () => renderCatDropdown($('fCat').value));
document.addEventListener('click', e => {
  if (!e.target.closest('.cat-combo')) $('catDropdown').classList.remove('open');
});
function renderCatDropdown(q) {
  const dd = $('catDropdown');
  const filtered = categories.filter(c => !q || c.name.toLowerCase().includes(q.toLowerCase()));
  const showNew  = q && !categories.find(c => c.name.toLowerCase()===q.toLowerCase());
  if (!filtered.length && !showNew) { dd.classList.remove('open'); return; }
  dd.innerHTML = filtered.map(c => `<div class="cat-opt" data-name="${esc(c.name)}">${c.emoji||'📦'} ${esc(c.name)}</div>`).join('')
    + (showNew ? `<div class="cat-opt new-opt" data-name="${esc(q)}">+ Создать «${esc(q)}»</div>` : '');
  dd.querySelectorAll('.cat-opt').forEach(opt => {
    opt.addEventListener('click', () => { $('fCat').value=opt.dataset.name; dd.classList.remove('open'); });
  });
  dd.classList.add('open');
}

// ══════════════════════════════════════════════════
// MANAGE CATEGORIES
// ══════════════════════════════════════════════════
function renderManageList() {
  $('manageList').innerHTML = categories.map(c => `
    <div class="manage-item">
      <span class="manage-emoji">${c.emoji||'📦'}</span>
      <span class="manage-name">${esc(c.name)}</span>
      <button class="manage-del" data-id="${c.id}">×</button>
    </div>`).join('');
  $('manageList').querySelectorAll('.manage-del').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm(`Удалить «${btn.closest('.manage-item').querySelector('.manage-name').textContent}»?`)) return;
      await deleteCategory(btn.dataset.id);
      renderManageList(); UI.toast('Удалено', 'ok');
    });
  });
}
$('btnManageCats').addEventListener('click', () => { renderManageList(); openSheet('manage'); });
$('btnAddCat').addEventListener('click', async () => {
  const name  = $('newCatName').value.trim();
  const emoji = $('newCatEmoji').value.trim() || '📦';
  if (!name) { UI.toast('Введи название', 'err'); return; }
  await addCategory(name, emoji);
  $('newCatName').value = ''; $('newCatEmoji').value = '';
  renderManageList(); UI.toast('Добавлено ✓', 'ok');
});

// ══════════════════════════════════════════════════
// MANAGE SHOPS
// ══════════════════════════════════════════════════
function renderManageShopsList() {
  if (!shops.length) {
    $('manageShopsList').innerHTML = `<div style="font-size:12px;color:var(--text3);padding:8px 2px">Пока нет ни одного магазина.</div>`;
    return;
  }
  $('manageShopsList').innerHTML = shops.map(s => `
    <div class="manage-item">
      <span class="manage-emoji">${esc(s.logo||'🛍️')}</span>
      <span class="manage-name">${esc(s.name)}</span>
      ${s.url ? `<span class="manage-sub">${esc(s.url.replace(/^https?:\/\//,'').replace(/\/$/,''))}</span>` : ''}
      <button class="manage-del" data-id="${s.id}">×</button>
    </div>`).join('');
  $('manageShopsList').querySelectorAll('.manage-del').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Удалить этот магазин? Варианты, привязанные к нему, останутся, но без магазина.')) return;
      await DB.delete('shops', btn.dataset.id);
      shops = shops.filter(s => s.id !== btn.dataset.id);
      renderManageShopsList(); render();
      UI.toast('Удалено', 'ok');
    });
  });
}
$('btnManageShops').addEventListener('click', () => { renderManageShopsList(); openSheet('manageShops'); });
$('btnSaveShop').addEventListener('click', async () => {
  const name = $('newShopName').value.trim();
  const logo = $('newShopLogo').value.trim() || '🛍️';
  const url  = $('newShopUrl').value.trim() || null;
  if (!name) { UI.toast('Введи название магазина', 'err'); return; }
  const rec = await DB.create('shops', { name, logo, url });
  shops.push(rec);
  $('newShopName').value = ''; $('newShopLogo').value = ''; $('newShopUrl').value = '';
  renderManageShopsList();
  UI.toast('Магазин добавлен ✓', 'ok');
});

// ══════════════════════════════════════════════════
// CONTROLS
// ══════════════════════════════════════════════════
$('fabAdd').addEventListener('click', openAdd);
$('searchIn').addEventListener('input', e => { searchQ=e.target.value; render(); });
$('statusTabs').addEventListener('click', e => {
  const tab = e.target.closest('.stab'); if(!tab) return;
  document.querySelectorAll('.stab').forEach(t => t.classList.remove('on'));
  tab.classList.add('on'); filterStatus=tab.dataset.s; render();
});
$('sourceFilterRow').addEventListener('click', e => {
  const pill = e.target.closest('.src-pill'); if(!pill) return;
  document.querySelectorAll('.src-pill').forEach(p => p.classList.remove('on'));
  pill.classList.add('on'); filterSource=pill.dataset.src; render();
});
document.querySelectorAll('.sort-opt').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sort-opt').forEach(b => b.classList.remove('on'));
    btn.classList.add('on'); sortMode=btn.dataset.sort; render();
  });
});

// ══════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
$('btnHub').addEventListener('click', () => location.href = '../hub/');

// ══════════════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════════════
(async () => {
  await lifeosInit();
  setView('gallery');
  await Promise.all([loadItems(), loadVariants(), loadShops(), loadCategories()]);
  render();
})();
</script>

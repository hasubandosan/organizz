<!DOCTYPE html>
<html lang="ru" data-module="hub">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Вход — LifeOS</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://organizz-core.pages.dev/styles.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="lg-wrap">
  <div class="lg-brand">
    <div class="lo-mark lg-mark" id="lgMark">🏠</div>
    <div>
      <div class="lg-name">LifeOS</div>
      <div class="lg-sub" id="lgSub">Один вход для всех модулей</div>
    </div>
  </div>

  <section class="lg-card">
    <div class="lg-tabs" role="tablist">
      <button id="tabLogin" class="lg-tab active" role="tab" type="button">Вход</button>
      <button id="tabRegister" class="lg-tab" role="tab" type="button">Регистрация</button>
    </div>

    <p id="authInfo" class="lg-msg lg-info hidden"></p>

    <form id="loginForm" class="lg-form" novalidate>
      <label class="lg-field"><span>Email</span>
        <input type="email" id="loginEmail" name="email" autocomplete="username" inputmode="email" autocapitalize="off" placeholder="you@example.com" required></label>
      <label class="lg-field"><span>Пароль</span>
        <span class="lg-pw"><input type="password" id="loginPassword" name="password" autocomplete="current-password" placeholder="Ваш пароль" required>
        <button type="button" class="lg-eye" data-eye="loginPassword" aria-label="Показать пароль">👁</button></span></label>
      <button type="submit" class="lg-submit" id="loginBtn">Войти</button>
    </form>

    <form id="registerForm" class="lg-form hidden" novalidate>
      <label class="lg-field"><span>Email</span>
        <input type="email" id="registerEmail" name="email" autocomplete="username" inputmode="email" autocapitalize="off" placeholder="you@example.com" required></label>
      <label class="lg-field"><span>Пароль</span>
        <span class="lg-pw"><input type="password" id="registerPassword" name="new-password" autocomplete="new-password" placeholder="Минимум 8 символов" minlength="8" required>
        <button type="button" class="lg-eye" data-eye="registerPassword" aria-label="Показать пароль">👁</button></span></label>
      <button type="submit" class="lg-submit" id="registerBtn">Создать аккаунт</button>
    </form>

    <p id="authError" class="lg-msg lg-error hidden" role="alert" aria-live="polite"></p>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>

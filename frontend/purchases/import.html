<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Импорт покупок из Supabase</title>
<style>
  :root{--bg:#0c0c0c;--s1:#141414;--s2:#1c1c1c;--b:#2a2a2a;--t:#eee;--m:#888;--a:#a78bfa;--ok:#4ade80;--err:#f87171}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--t);font:14px/1.5 system-ui,sans-serif;padding:20px;max-width:640px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px} p{color:var(--m);margin:4px 0 14px}
  label{display:block;font-size:12px;color:var(--m);margin:12px 0 4px}
  input[type=text],input[type=password]{width:100%;padding:10px;border-radius:8px;border:1px solid var(--b);background:var(--s2);color:var(--t);font:inherit}
  .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  button{padding:10px 16px;border-radius:8px;border:1px solid var(--b);background:var(--s2);color:var(--t);font:inherit;cursor:pointer}
  button.primary{background:var(--a);border-color:var(--a);color:#000;font-weight:700} button:disabled{opacity:.5;cursor:default}
  .chk{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--m)}
  .bar{height:8px;background:var(--s2);border-radius:4px;margin-top:14px;overflow:hidden}.bar>div{height:100%;width:0;background:var(--a);transition:width .2s}
  #log{margin-top:12px;background:var(--s1);border:1px solid var(--b);border-radius:8px;padding:10px;height:260px;overflow:auto;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap}
  .ok{color:var(--ok)}.err{color:var(--err)} a{color:var(--a)}
</style>
</head>
<body>
<h1>Импорт покупок из Supabase</h1>
<p>Данные попадут <b>только в аккаунт, под которым ты сейчас вошёл</b> (у каждого пользователя свои). Старые данные в Supabase не изменяются. Повторный запуск безопасен: уже перенесённое пропускается.</p>

<label>Supabase URL</label>
<input id="url" type="text" value="https://wjeleewngroogzihfthv.supabase.co"/>
<label>Supabase anon key (в старом index.html — строка <code>SUPABASE_ANON</code>)</label>
<input id="key" type="password" placeholder="eyJ..." autocomplete="off"/>
<label class="chk"><input id="over" type="checkbox"/> Перезаписать уже перенесённое (затрёт правки, сделанные в новом приложении)</label>

<div class="row">
  <button id="btnCheck">1. Проверить</button>
  <button id="btnRun" class="primary" disabled>2. Импортировать</button>
  <a href="./" style="align-self:center;margin-left:auto">← к покупкам</a>
</div>
<div class="bar"><div id="prog"></div></div>
<div id="log"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>window.LIFEOS_APP_SLUG = 'purchases';</script>
<script src="../core/db.js"></script>
<script>
const $ = id => document.getElementById(id);
const ST = { want: 'wish', ordered: 'ordered', done: 'in_stock' };
function log(m, cls) { const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = m; $('log').appendChild(d); $('log').scrollTop = 1e9; }
// не передаём undefined: DB.create затирает им createdAt/updatedAt по умолчанию
const mk = (col, o) => DB.create(col, Object.fromEntries(Object.entries(o).filter(([, v]) => v !== undefined)));
function setProg(p) { $('prog').style.width = Math.round(p * 100) + '%'; }
let sb = null, data = null;

async function fetchAll(table, build) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    let q = sb.from(table).select('*').order('id').range(from, from + 999);
    if (build) q = build(q);
    const { data: rows, error } = await q;
    if (error) throw new Error(table + ': ' + error.message);
    out.push(...rows);
    if (rows.length < 1000) break;
  }
  return out;
}
async function readSupabase() {
  sb = supabase.createClient($('url').value.trim(), $('key').value.trim());
  const zones = await fetchAll('zones');
  const products = await fetchAll('products', q => q.or('module.eq.shopping,source_module.eq.cosplay'));
  const shops = await fetchAll('shops');
  const variants = [];
  const ids = products.map(p => p.id);
  for (let i = 0; i < ids.length; i += 80) {
    variants.push(...await fetchAll('variants', q => q.in('product_id', ids.slice(i, i + 80))));
  }
  return { zones, products, shops, variants };
}

$('btnCheck').onclick = async () => {
  $('log').innerHTML = ''; $('btnRun').disabled = true;
  if (!$('key').value.trim()) { log('Вставь anon key', 'err'); return; }
  try {
    await DB.getAll('zones');   // проверка входа в LifeOS (при отсутствии токена будет редирект на логин)
    log('Читаю Supabase…');
    data = await readSupabase();
    const withImg = data.variants.filter(v => v.image_url).length;
    log(`Найдено: зон ${data.zones.length}, товаров ${data.products.length}, вариантов ${data.variants.length} (с фото ${withImg}), магазинов ${data.shops.length}`, 'ok');
    $('btnRun').disabled = false;
  } catch (e) { log('Ошибка: ' + e.message, 'err'); }
};

function compressBlob(blob, maxSide = 1280, q = 0.82) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(blob), img = new Image();
    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('не удалось декодировать картинку')); };
    img.src = u;
  });
}
async function pool(items, n, fn) {
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
    while (i < items.length) { const it = items[i++]; await fn(it); }
  }));
}

$('btnRun').onclick = async () => {
  if (!data) return;
  $('btnRun').disabled = true; $('btnCheck').disabled = true;
  const over = $('over').checked;
  const total = data.shops.length + data.zones.length + data.products.length + data.variants.length;
  let done = 0; const tick = () => setProg(++done / total);
  const st = { shops: 0, zones: 0, products: 0, variants: 0, images: 0, skipped: 0, failed: 0 };
  try {
    const ex = {};
    for (const c of ['shops', 'zones', 'purchases', 'purchase_variants']) ex[c] = new Map((await DB.getAll(c)).map(r => [r.id, r]));
    const zoneName = new Map(data.zones.map(z => [z.id, z.name]));

    for (const s of data.shops) {
      if (ex.shops.has(s.id) && !over) { st.skipped++; tick(); continue; }
      await mk('shops', { id: s.id, name: s.name, logo: '🛍️', createdAt: s.created_at || undefined }); st.shops++; tick();
    }
    log(`Магазины: ${st.shops}`);

    for (const z of data.zones) {
      if (ex.zones.has(z.id) && !over) { st.skipped++; tick(); continue; }
      await mk('zones', {
        id: z.id, name: z.name, emoji: z.emoji || '📦', parentId: z.parent_id || null,
        modules: Array.isArray(z.modules) && z.modules.length ? z.modules : ['shopping'],
        showInPurchases: !!z.show_in_purchases, createdAt: z.created_at || undefined,
      }); st.zones++; tick();
    }
    log(`Зоны: ${st.zones}`);

    const okProducts = new Set();
    for (const p of data.products) {
      okProducts.add(p.id);
      if (!p.name || !p.name.trim()) { log('Пропущен товар без названия: ' + p.id, 'err'); st.failed++; tick(); continue; }
      if (ex.purchases.has(p.id) && !over) { st.skipped++; tick(); continue; }
      const cos = p.source_module === 'cosplay';
      await mk('purchases', {
        id: p.id, name: p.name, zoneId: p.zone_id || null, category: zoneName.get(p.zone_id) || null,
        status: ST[p.status] || 'wish', priority: p.priority ?? 1, tags: p.tags || [], notes: p.notes || null,
        sourceType: cos ? 'cosplay' : 'manual', sourceId: p.source_item_id || null,
        metadata: { importedFrom: 'supabase' }, createdAt: p.created_at || undefined, updatedAt: p.created_at || undefined,
      }); st.products++; tick();
    }
    log(`Товары: ${st.products}`);

    await pool(data.variants.filter(v => okProducts.has(v.product_id)), 3, async v => {
      try {
        const old = ex.purchase_variants.get(v.id);
        if (old && !over) { st.skipped++; return; }
        let imageIds = old && old.imageIds && old.imageIds.length ? old.imageIds : [];
        let meta = {};
        if (v.image_url && !imageIds.length) {
          try {
            const r = await fetch(v.image_url);
            if (!r.ok) throw new Error('HTTP ' + r.status);
            imageIds = [await DB.saveImage(await compressBlob(await r.blob()), { name: 'variant-photo' })];
            st.images++;
          } catch (e) { log(`Фото не перенесено (${v.name || v.id}): ${e.message}`, 'err'); meta = { legacyImageUrl: v.image_url }; st.failed++; }
        }
        await mk('purchase_variants', {
          id: v.id, purchaseId: v.product_id, title: v.name || null, price: v.price ?? null, url: v.url || null,
          notes: v.note || null, shopId: v.shop_id || null, isPrimary: !!v.is_favorite, imageIds, metadata: meta,
          createdAt: v.created_at || undefined, updatedAt: v.created_at || undefined,
        }); st.variants++;
      } catch (e) { log(`Вариант ${v.id}: ${e.message}`, 'err'); st.failed++; }
      finally { tick(); }
    });
    setProg(1);
    log(`Готово ✓ вариантов ${st.variants}, фото ${st.images}, пропущено (уже было) ${st.skipped}, ошибок ${st.failed}`, st.failed ? 'err' : 'ok');
  } catch (e) { log('Остановлено: ' + e.message + ' — можно запустить снова, перенесённое пропустится.', 'err'); }
  $('btnCheck').disabled = false;
};
</script>
</body>
</html>

// tags (системные + личные, хранится tagIds)
const tagIn = $('tagIn');
function tagSuggestions() {
  const q = tagIn.value.trim(), ql = q.toLowerCase(), box = $('tagSuggest');
  const list = tagOpts.filter(o => !curTagIds.includes(o.id) && (!ql || o.name.toLowerCase().includes(ql))).slice(0, 60);
  let html = '';
  for (const [kind, title] of [['category', 'Категории'], ['tag', 'Теги']]) {
    const part = list.filter(o => (o.kind || 'tag') === kind);
    if (!part.length) continue;
    html += `<div class="ts-g" style="font-size:11px">${title}</div>`;
    let g = null;
    part.forEach(o => {
      const grp = o.group || (kind === 'category' ? 'Мои категории' : 'Мои теги');
      if (grp !== g) { g = grp; html += `<div class="ts-g">${esc(g)}</div>`; }
      html += `<button type="button" class="ts-o ${kind === 'category' ? 'cat' : ''}" data-id="${esc(o.id)}">${esc(o.name)}</button>`;
    });
  }
  if (q && !tagOpts.some(o => o.name.toLowerCase() === ql)) {
    html += `<div><button type="button" class="ts-new" data-new="tag">＋ тег «${esc(q)}»</button>` +
            `<button type="button" class="ts-new" data-new="category">＋ категория «${esc(q)}»</button></div>`;
  }
  if (!html) { box.style.display = 'none'; return; }
  box.innerHTML = html; box.style.display = 'block';
}
$('tagSuggest').addEventListener('mousedown', e => {
  const n = e.target.closest('.ts-new');
  if (n) { e.preventDefault(); addTagByName(tagIn.value.trim(), n.dataset.new); return; }
  const b = e.target.closest('.ts-o'); if (!b) return;
  e.preventDefault(); addTagId(b.dataset.id);
});
function addTagId(id) {
  if (!curTagIds.includes(id)) curTagIds.push(id);
  tagIn.value = ''; renderTagChips();
}
async function addTagByName(v, kind = 'tag') {
  if (!v) return;
  const o = tagOpts.find(x => x.name.toLowerCase() === v.toLowerCase());
  if (o) { addTagId(o.id); return; }
  try {   // новый личный тег (хранится в общем модуле 'shared', виден во всех твоих модулях)
    const rec = await DB.create('tags', { name: v, kind, group: kind === 'category' ? 'Мои категории' : 'Мои теги', scope: ['purchases'] }, 'shared');
    const opt = { ...rec, kind, system: false };
    tagOpts.push(opt); tagMap[rec.id] = opt; addTagId(rec.id);
  } catch (e) { toast('Не удалось создать тег', 'err'); tagIn.value = ''; }
}
tagIn.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addTagByName(tagIn.value.trim()); }
  if (e.key === 'Backspace' && !tagIn.value) {
    if (curLegacy.length) curLegacy.pop(); else curTagIds.pop();
    renderTagChips();
  }
});
tagIn.addEventListener('input', tagSuggestions);
tagIn.addEventListener('focus', tagSuggestions);
tagIn.addEventListener('blur', () => {
  if (tagIn.value.trim()) addTagByName(tagIn.value.trim());
  setTimeout(() => { $('tagSuggest').style.display = 'none'; }, 150);
});
$('tagsWrap').addEventListener('click', () => tagIn.focus());
function renderTagChips() {
  $('tagsWrap').querySelectorAll('.tc').forEach(el => el.remove());
  curTagIds.forEach((id, i) => {
    const chip = document.createElement('span');
    chip.className = 'tc' + (tagMap[id]?.kind === 'category' ? ' cat' : '');
    chip.innerHTML = `${esc(tagMap[id]?.name || id)}<button type="button">×</button>`;
    chip.querySelector('button').addEventListener('click', () => { curTagIds.splice(i, 1); renderTagChips(); });
    $('tagsWrap').insertBefore(chip, tagIn);
  });
  curLegacy.forEach((t, i) => {
    const chip = document.createElement('span');
    chip.className = 'tc legacy';
    chip.innerHTML = `<span title="Нажми, чтобы сделать настоящим тегом">${esc(t)}</span><button type="button">×</button>`;
    chip.querySelector('span').addEventListener('click', e => { e.stopPropagation(); curLegacy.splice(i, 1); renderTagChips(); addTagByName(t); });
    chip.querySelector('button').addEventListener('click', () => { curLegacy.splice(i, 1); renderTagChips(); });
    $('tagsWrap').insertBefore(chip, tagIn);
  });
  if (document.activeElement === tagIn) tagSuggestions();
}

function renderShopDropdown(q) {
  const dd = $('shopDropdown');
  const filtered = shops.filter(s => !q || s.name.toLowerCase().includes(q.toLowerCase()));
  const showNew = q && !shops.find(s => s.name.toLowerCase() === q.toLowerCase());
  if (!filtered.length && !showNew) { dd.classList.remove('open'); return; }
  dd.innerHTML = filtered.map(s => `<div class="cat-opt" data-id="${s.id}" data-name="${esc(s.name)}">🏬 ${esc(s.name)}</div>`).join('')
    + (showNew ? `<div class="cat-opt new-opt" data-name="${esc(q)}">+ Создать «${esc(q)}»</div>` : '');
  dd.querySelectorAll('.cat-opt').forEach(opt => {
    opt.addEventListener('click', () => {
      $('vShop').value = opt.dataset.name;
      $('vShop').dataset.shopId = opt.dataset.id || '';
      dd.classList.remove('open');
    });
  });
  dd.classList.add('open');
}
async function resolveShopId() {
  const name = $('vShop').value.trim();
  if (!name) return null;
  let id = $('vShop').dataset.shopId;
  if (id) return id;
  const existing = shops.find(s => s.name.toLowerCase() === name.toLowerCase());
  if (existing) return existing.id;
  const rec = await DB.create('shops', { name, logo: '🛍️' });
  shops.push(rec);
  return rec.id;
}

function renderZoneManageList() {
  const wrap = $('zoneManageList');
  wrap.innerHTML = '';
  function walk(parentId, depth) {
    zoneChildren(parentId).forEach(z => {
      const row = document.createElement('div');
      row.className = 'zman-row';
      row.style.marginLeft = (depth * 16) + 'px';
      const hp = countHighPriorityInZone(z.id);
      row.innerHTML = `
        <span class="zman-emoji">${z.emoji || '📦'}</span>
        <span class="zman-name">${esc(z.name)}</span>
        ${hp ? `<span class="zone-prio-badge">🔴 ${hp}</span>` : ''}
        <span class="zman-count">${countProductsInZone(z.id)} · ${sumZone(z.id) ? fmtPrice(sumZone(z.id)) : '—'}</span>
        <div class="zman-btns">
          <button data-act="add" title="Добавить товар">＋</button>
          <button data-act="add-sub" title="Добавить подзону">🗂</button>
          <button data-act="edit" title="Редактировать">✎</button>
          <button data-act="del" title="Удалить">×</button>
        </div>`;
      row.querySelector('[data-act="add"]').addEventListener('click', () => openQuickAdd(z.id));
      row.querySelector('[data-act="add-sub"]').addEventListener('click', () => openZoneModal(null, z.id));
      row.querySelector('[data-act="edit"]').addEventListener('click', () => openZoneModal(z, z.parent_id));
      row.querySelector('[data-act="del"]').addEventListener('click', async () => {
        if (!confirm(`Удалить зону «${z.name}»? Товары из неё станут «без зоны».`)) return;
        const ok = await removeZone(z.id);
        if (ok) { renderZoneManageList(); render(); toast('Удалено', 'ok'); }
      });
      attachZoneDrag(row, z.id);
      attachDropTarget(row, z.id);
      wrap.appendChild(row);
      walk(z.id, depth + 1);
    });
  }
  walk(null, 0);
  if (!wrap.children.length) wrap.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:8px 0">Зон нет</div>';
}

// ══════════════════════════════════════════════════
document.addEventListener('visibilitychange', async () => {
  // ссылки на фото живут ~1 ч — после долгого простоя перезагружаем данные
  if (document.visibilityState === 'visible' && lastLoadAt && Date.now() - lastLoadAt > 40 * 60 * 1000) {
    try { await loadAll(); render(); } catch (e) { /* не критично */ }
  }
});
(async () => {
  const savedUI = loadUIState();
  if (savedUI) {
    if (savedUI.gridCols >= 4 && savedUI.gridCols <= 8) gridCols = savedUI.gridCols;
    if (savedUI.viewMode === 'list' || savedUI.viewMode === 'gallery') viewMode = savedUI.viewMode;
  }
  $('gridColsLabel').textContent = gridCols;
  try {
    await lifeosInit();
    await loadAll();
  } catch (e) {
    console.error(e);
    loadingEl.style.display = 'none';
    toast('Ошибка загрузки: ' + e.message, 'err');
    return;
  }
  zones.forEach(z => {
    if (savedUI && savedUI.openZones && Object.prototype.hasOwnProperty.call(savedUI.openZones, z.id)) z._open = savedUI.openZones[z.id];
    else if (z._open === undefined) z._open = true;
  });
  setView(viewMode);
  syncViewBtn();
  if (savedUI && typeof savedUI.scrollTop === 'number') {
    requestAnimationFrame(() => { $('scrollArea').scrollTop = savedUI.scrollTop; });
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru" data-module="cosplays">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0a0f"/>
<title>Косплей — LifeOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://organizz-core.pages.dev/styles.css"/>
<style>
  html,body{height:100%;overflow:hidden}
  body{font-family:var(--f)}
  #app{display:flex;flex-direction:column;height:100dvh}
  .lo-header{flex:none}
  .scroll{flex:1;overflow-y:auto;padding:4px max(16px,calc((100% - var(--content-max))/2 + 16px)) 110px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
  a{color:inherit;text-decoration:none}

  /* хлебные крошки */
  .crumbs{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px max(16px,calc((100% - var(--content-max))/2 + 16px));font-size:12px;color:var(--text3)}
  .crumbs a{color:var(--text2);padding:3px 6px;border-radius:6px}
  .crumbs a:hover{background:var(--bg3);color:var(--accent2)}
  .crumbs b{color:var(--text);font-weight:600;padding:3px 6px}

  .empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:60px 16px;color:var(--text3);text-align:center}
  .empty .ico{font-size:48px;opacity:.35}

  /* главная: фандомы -> персонажи */
  .fd-h{display:flex;align-items:center;gap:8px;margin:18px 0 10px;font-size:15px;font-weight:700}
  .fd-h i{font-style:normal;font-size:12px;color:var(--text3);font-weight:500}
  .char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .char-card{display:block;background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .15s,transform .15s}
  .char-card:hover{border-color:var(--purple)}
  .char-card:active{transform:scale(.97)}
  .ph{position:relative;width:100%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:38px;color:var(--text3);overflow:hidden}
  .ph.p34{aspect-ratio:3/4}
  .ph.sq{aspect-ratio:1/1}
  .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
  .ph img.ok{opacity:1}
  .cc-b{padding:9px 10px 10px}
  .cc-n{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cc-s{font-size:11px;color:var(--text3);margin-top:2px}
  .bar{height:3px;background:var(--bg4);border-radius:3px;overflow:hidden;margin-top:7px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--accent2))}

  /* страница персонажа / образа: слева портрет, справа содержимое */
  .cp{display:grid;grid-template-columns:260px 1fr;gap:22px;align-items:start;margin-top:6px}
  .cp-side{position:sticky;top:0}
  .cp-title{font-size:22px;line-height:1.2;font-weight:800;color:var(--accent);margin:0 0 12px;word-break:break-word}
  .cp-photo{border-radius:14px;border:1px solid var(--border)}
  .cp-thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .cp-thumbs .ph{width:52px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:16px}
  .cp-meta{margin-top:10px;font-size:12px;color:var(--text2)}
  .cp-note{margin-top:8px;font-size:12px;color:var(--text3);white-space:pre-wrap}
  .cp-act{display:flex;gap:8px;margin-top:12px}
  .sec-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin:0 0 10px}
  .look-list{display:flex;flex-direction:column;gap:8px}
  .look-card{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:8px;transition:border-color .15s}
  .look-card:hover{border-color:var(--purple)}
  .look-card .ph{width:72px;flex:none;border-radius:8px;font-size:24px}
  .lc-b{flex:1;min-width:0}
  .lc-n{font-size:14px;font-weight:700}
  .lc-s{font-size:12px;color:var(--text3);margin-top:2px}

  /* инвентарь образа: ячейки по слотам, с головы до ног, по центру */
  .inv{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
  .slot{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:8px 8px 10px}
  .slot-h{display:flex;align-items:center;gap:6px;justify-content:center;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:8px}
  .slot-tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
  .tile{width:78px;cursor:pointer;text-align:center}
  .tw{position:relative}
  .mk{position:absolute;top:3px;left:3px;font-size:11px;line-height:1;background:rgba(0,0,0,.6);border-radius:5px;padding:2px 3px;z-index:2}
  .tile .ph{border-radius:9px;border:2px solid var(--border2);font-size:22px}
  .tile.st-dream .ph{border-color:#b79cff}
  .tile.st-ordered .ph{border-color:var(--orange)}
  .tile.st-in_stock .ph{border-color:var(--green)}
  .tile:hover .ph{filter:brightness(1.12)}
  .tile-n{font-size:10.5px;font-weight:600;margin-top:4px;line-height:1.2;max-height:2.4em;overflow:hidden}
  .tile-p{font-size:10px;color:var(--text3);font-family:var(--mono)}
  .tile.add .ph{border:2px dashed var(--border2);background:transparent;font-size:20px}
  .tile.add:hover .ph{border-color:var(--accent);color:var(--accent2)}

  .fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:max(18px,calc((100vw - var(--content-max))/2 + 18px));height:50px;padding:0 20px;border-radius:25px;background:var(--accent);color:var(--on-accent);font-size:14px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.45);z-index:50}

  /* формы и кнопки */
  .fg{margin-bottom:14px}
  .fl{display:block;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
  .fi{width:100%;padding:10px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);font-size:14px;color:var(--text)}
  .fi:focus{outline:none;border-color:var(--accent)}
  textarea.fi{min-height:70px;resize:vertical}
  .row{display:flex;gap:8px}
  .cb{padding:10px 16px;border-radius:var(--r);font-size:13px;font-weight:700;border:1px solid var(--border2);background:var(--bg3);color:var(--text)}
  .cb:hover{border-color:var(--accent)}
  .cb.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .cb.dng{color:#f05060;border-color:rgba(240,80,96,.4)}
  .cb.sm{padding:6px 12px;font-size:12px}
  .cb:disabled{opacity:.5;pointer-events:none}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:7px 12px;border-radius:100px;font-size:12px;font-weight:600;border:1px solid var(--border2);background:var(--bg3);color:var(--text2)}
  .chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .up{position:relative;border:1.5px dashed var(--border2);border-radius:var(--r2);background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:13px;cursor:pointer;overflow:hidden}
  .up.p34{aspect-ratio:3/4;max-width:200px}
  .up.sq{aspect-ratio:1/1;max-width:140px}
  .up img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .refs{display:flex;flex-wrap:wrap;gap:8px}
  .ref{position:relative;width:76px}
  .ref .ph{border-radius:8px;border:1px solid var(--border)}
  .ref button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--bg4);border:1px solid var(--border2);font-size:11px;color:var(--text2)}
  .ref-add{width:76px;aspect-ratio:3/4;border:1.5px dashed var(--border2);border-radius:8px;background:var(--bg3);color:var(--text3);font-size:22px}
  .sug{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .sug-row{display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);padding:6px 8px;cursor:pointer}
  .sug-row:hover{border-color:var(--accent)}
  .sug-row .ph{width:38px;border-radius:6px;font-size:14px;flex:none}
  .sug-t{flex:1;min-width:0;font-size:13px;font-weight:600}
  .sug-t small{display:block;font-weight:400;color:var(--text3);font-size:11px}
  .var-row{display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);padding:8px;margin-bottom:6px}
  .var-row .ph{width:48px;border-radius:6px;font-size:16px;flex:none;cursor:pointer}
  .var-row.pref{border-color:var(--accent)}
  .var-i{flex:1;min-width:0;font-size:13px;cursor:pointer}
  .var-i small{display:block;color:var(--text3);font-size:11px}
  .fd-ico{width:22px;height:22px;object-fit:contain;vertical-align:middle;border-radius:5px}
  .fd-cur{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px;font-weight:600}
  .fd-cur .ib{margin-left:auto}
  .ib{width:30px;height:30px;border-radius:8px;background:var(--bg4);color:var(--text2);font-size:14px;flex:none}
  .ib.on{color:var(--accent);background:rgba(160,112,240,.12)}
  .others{font-size:12px;color:var(--text2)}
  .others a{color:var(--accent2)}
  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--bg4);border:1px solid var(--border2);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:900;max-width:90vw}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:800;display:flex;align-items:center;justify-content:center;padding:20px}
  .lb img{max-width:100%;max-height:100%;border-radius:10px}

  @media (max-width:720px){
    .cp{grid-template-columns:1fr;gap:14px}
    .cp-side{position:static;display:grid;grid-template-columns:130px 1fr;gap:6px 14px;align-items:start}
    .cp-title{grid-column:1/-1;font-size:20px;margin-bottom:2px}
    .cp-photo{grid-row:2/6}
    .tile{width:70px}
    .inv{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="app">
  <div class="crumbs" id="crumbs" style="display:none"></div>
  <div class="scroll" id="main"></div>
</div>
<button class="fab" id="fab" type="button" style="display:none"></button>
<div class="toast" id="toast"></div>

<script>window.LIFEOS_APP_SLUG = 'cosplays';</script>
<script src="https://organizz-core.pages.dev/db.js"></script>
<script src="https://organizz-core.pages.dev/nav.js"></script>
<script src="https://organizz-core.pages.dev/shell.js"></script>
<script>window.LifeShell = window.LifeShell || { mount() {}, update() {} };</script>
<script src="https://organizz-core.pages.dev/fandoms.js"></script>
<script>window.LIFEOS_FANDOMS = window.LIFEOS_FANDOMS || [];</script>
<script>
'use strict';
/* ═════════ Косплей v2 ═════════
   Свои данные (модуль cosplays): fandoms, characters, looks, items.
   items — это СВЯЗЬ «образ ↔ покупка»: {lookId, purchaseId, tagIds:[тип], notes}.
   Название, цена, магазины, фото и статус живут в модуле «Покупки» (purchases, purchase_variants, shops),
   поэтому один и тот же предмет можно использовать у разных героев и менять в одном месте. */

const PUR = 'purchases';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const byCreated = (a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || ''));
const byName = (a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'ru');
const money = n => n == null || n === '' ? '' : new Intl.NumberFormat('ru-RU').format(n) + ' ₽';

// «с головы до ног»; тип предмета = системный тег «Элемент образа»
const SLOTS = [
  { id: 'head',  label: 'Голова',            emoji: '💇' },
  { id: 'face',  label: 'Лицо',              emoji: '💄' },
  { id: 'body',  label: 'Тело',              emoji: '👗' },
  { id: 'acc',   label: 'Украшения и детали', emoji: '💍' },
  { id: 'feet',  label: 'Обувь',             emoji: '👠' },
  { id: 'props', label: 'Реквизит',          emoji: '⚔️' },
];
const TYPES = [
  { tag: 'sys:cp-wig',       label: 'Парик / причёска',   emoji: '💇', slot: 'head' },
  { tag: 'sys:cp-makeup',    label: 'Грим / макияж',      emoji: '💄', slot: 'face' },
  { tag: 'sys:cp-lenses',    label: 'Линзы',              emoji: '👁️', slot: 'face' },
  { tag: 'sys:cp-dress',     label: 'Платье / костюм',    emoji: '👗', slot: 'body' },
  { tag: 'sys:cp-armor',     label: 'Броня / детали',     emoji: '🛡️', slot: 'body' },
  { tag: 'sys:cp-underwear', label: 'Бельё / база',       emoji: '🩱', slot: 'body' },
  { tag: 'sys:cp-accessory', label: 'Аксессуар / украшение', emoji: '💍', slot: 'acc' },
  { tag: 'sys:cp-wings',     label: 'Крылья / аппликации', emoji: '🪽', slot: 'acc' },
  { tag: 'sys:cp-bag',       label: 'Сумка / пояс',       emoji: '👜', slot: 'acc' },
  { tag: 'sys:cp-shoes',     label: 'Обувь',              emoji: '👠', slot: 'feet' },
  { tag: 'sys:cp-weapon',    label: 'Оружие / бутафория', emoji: '⚔️', slot: 'props' },
  { tag: 'sys:cp-artifact',  label: 'Артефакт / реквизит', emoji: '🔮', slot: 'props' },
];
// Фандомы: системный каталог (общий, с эмодзи/логотипом) + свои у пользователя (только название и эмодзи)
const FD_BASE = 'https://organizz-core.pages.dev/';
const SYS_FANDOMS = (window.LIFEOS_FANDOMS || []).map(f => ({ ...f, id: 'sys:' + f.id, system: true }));
const fandomById = id => id ? (fandoms.find(f => f.id === id) || SYS_FANDOMS.find(f => f.id === id) || null) : null;
const allFandoms = () => [...fandoms.map(f => ({ ...f, system: false })), ...SYS_FANDOMS];
function fdIcon(f) {
  const em = esc(f && f.emoji ? f.emoji : '✨');
  return f && f.logo ? `<img class="fd-ico" src="${FD_BASE}${esc(f.logo)}" alt="" onerror="this.outerHTML='${em}'">` : em;
}
const typeOf = tag => TYPES.find(t => t.tag === tag) || TYPES[TYPES.length - 1];
const STATUSES = [['dream', 'Мечта'], ['wish', 'Хочу'], ['ordered', 'Заказано'], ['in_stock', 'Куплено']];
// предмет «сделать самой» (DIY): без покупки, свой статус
const MAKE_ST = [['todo', 'Задумано'], ['doing', 'В работе'], ['done', 'Готово']];
const MAKE_CLS = { todo: 'dream', doing: 'ordered', done: 'in_stock' };

// ───────── состояние ─────────
let fandoms = [], chars = [], looks = [], items = [];
let purchases = new Map(), variants = new Map(), shops = [];

async function loadAll() {
  const [f, c, l, i, p, v, s] = await Promise.all([
    DB.getAll('fandoms'), DB.getAll('characters'), DB.getAll('looks'), DB.getAll('items'),
    DB.getAll('purchases', PUR).catch(() => []), DB.getAll('purchase_variants', PUR).catch(() => []), DB.getAll('shops', PUR).catch(() => []),
  ]);
  fandoms = f.sort(byName); chars = c.sort(byCreated); looks = l.sort(byCreated); items = i.sort(byCreated);
  purchases = new Map(p.map(x => [x.id, x]));
  variants = new Map();
  v.sort(byCreated).forEach(x => { if (!variants.has(x.purchaseId)) variants.set(x.purchaseId, []); variants.get(x.purchaseId).push(x); });
  shops = s.sort(byName);
}
const upsert = (arr, rec) => { const k = arr.findIndex(x => x.id === rec.id); k >= 0 ? (arr[k] = rec) : arr.push(rec); return rec; };

// ───────── картинки ─────────
const imgCache = new Map();
function imgUrl(slug, id) {
  if (!id) return Promise.resolve(null);
  const k = slug + ':' + id, hit = imgCache.get(k);
  if (hit && Date.now() - hit.t < 40 * 60000) return hit.p;
  const p = DB.getImage(id, slug === 'cosplays' ? undefined : slug).then(r => (r && r.data) || null).catch(() => null);
  imgCache.set(k, { p, t: Date.now() });
  return p;
}
function hydrate(root) {
  (root || document).querySelectorAll('img[data-img]').forEach(async el => {
    const [slug, id] = el.dataset.img.split(':');
    const u = await imgUrl(slug, id);
    if (u) { el.src = u; el.classList.add('ok'); }
  });
}
const ph = (cls, slug, id, fallback) => `<div class="ph ${cls}">${id ? `<img data-img="${slug}:${id}" alt="">` : ''}<span>${fallback || ''}</span></div>`;
async function dropImg(id, slug) { if (id) { try { await DB.deleteImage(id, slug === 'cosplays' ? undefined : slug); } catch (e) { /* не критично */ } } }

// обрезка по центру до нужной пропорции + сжатие (портрет 3:4, предметы 1:1)
function prepImage(file, aspect, maxSide = 1000, q = 0.85) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('Не удалось прочитать файл'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => reject(new Error('Это не картинка'));
      im.onload = () => {
        let sw = im.width, sh = im.height, sx = 0, sy = 0;
        if (aspect) {
          if (sw / sh > aspect) { const nw = sh * aspect; sx = (sw - nw) / 2; sw = nw; }
          else { const nh = sw / aspect; sy = (sh - nh) / 2; sh = nh; }
        }
        const k = Math.min(1, maxSide / Math.max(sw, sh));
        const w = Math.round(sw * k), h = Math.round(sh * k);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
        x.drawImage(im, sx, sy, sw, sh, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', q));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

// ───────── вычисления ─────────
const itemsOfLook = id => items.filter(i => i.lookId === id);
function itemView(it) {
  if (it.how === 'make') {
    return { it, p: null, vs: [], main: null, make: true, name: it.name || 'Без названия', status: MAKE_CLS[it.makeStatus || 'todo'],
      price: null, imgId: it.photoImageId || null, imgSlug: 'cosplays', type: typeOf((it.tagIds || [])[0]) };
  }
  const p = purchases.get(it.purchaseId);
  const vs = variants.get(it.purchaseId) || [];
  const main = vs.find(v => v.isPrimary) || vs[0];
  const withImg = (main && main.imageIds && main.imageIds[0]) ? main : vs.find(v => v.imageIds && v.imageIds[0]);
  return {
    it, p, vs, main, name: p ? p.name : '(покупка удалена)', status: p ? (p.status || 'wish') : 'wish',
    price: main ? main.price : null, imgId: withImg ? withImg.imageIds[0] : null, imgSlug: PUR, type: typeOf((it.tagIds || [])[0]),
  };
}
function lookProgress(lookId) {
  const its = itemsOfLook(lookId); if (!its.length) return { n: 0, done: 0, pct: 0 };
  const done = its.filter(i => i.how === 'make' ? i.makeStatus === 'done' : (purchases.get(i.purchaseId) || {}).status === 'in_stock').length;
  return { n: its.length, done, pct: Math.round(done * 100 / its.length) };
}
function charProgress(charId) {
  const ls = looks.filter(l => l.charId === charId); let n = 0, done = 0;
  ls.forEach(l => { const p = lookProgress(l.id); n += p.n; done += p.done; });
  return { looks: ls.length, n, done, pct: n ? Math.round(done * 100 / n) : 0 };
}

// ───────── интерфейс: утилиты ─────────
let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
async function lock(btn, fn) {
  btn.disabled = true;
  try { await fn(); } catch (e) { console.error(e); toast('Ошибка: ' + (e.message || e)); } finally { btn.disabled = false; }
}
const field = (label, inner) => `<div class="fg"><label class="fl">${label}</label>${inner}</div>`;
function closeModal() { const m = $('mdl'); if (m) m.remove(); }
function openModal({ title, body, footer, lg }, mount) {
  closeModal();
  const el = document.createElement('div');
  el.className = 'modal-overlay open'; el.id = 'mdl';
  el.innerHTML = `<div class="modal${lg ? ' lg' : ''}"><div class="modal-header"><div class="modal-title">${title}</div><button class="modal-close" data-x type="button">✕</button></div>
    <div class="modal-body">${body}</div>${footer ? `<div class="modal-footer">${footer}</div>` : ''}</div>`;
  el.addEventListener('mousedown', e => { if (e.target === el) closeModal(); });
  el.addEventListener('click', e => { if (e.target.closest('[data-x],[data-x2]')) closeModal(); });
  document.body.appendChild(el);
  hydrate(el);
  if (mount) mount(el);
  return el;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); const lb = document.querySelector('.lb'); if (lb) lb.remove(); } });
function lightbox(url) { const d = document.createElement('div'); d.className = 'lb'; d.innerHTML = `<img src="${esc(url)}" alt="">`; d.onclick = () => d.remove(); document.body.appendChild(d); }

// ───────── маршрутизация (#/, #/c/<id>, #/c/<id>/l/<id>) ─────────
function route() {
  const m = location.hash.replace(/^#\/?/, '').split('/');
  if (m[0] === 'c' && m[1]) return m[2] === 'l' && m[3] ? { v: 'look', c: m[1], l: m[3] } : { v: 'char', c: m[1] };
  return { v: 'home' };
}
function render() {
  const r = route(), main = $('main'), crumbs = $('crumbs'), fab = $('fab');
  const ch = r.c ? chars.find(x => x.id === r.c) : null;
  const lk = r.l ? looks.find(x => x.id === r.l) : null;
  if ((r.v !== 'home' && !ch) || (r.v === 'look' && (!lk || lk.charId !== ch.id))) { location.hash = '#/'; return; }
  const fd = ch && ch.fandomId ? fandomById(ch.fandomId) : null;
  const title = r.v === 'home' ? 'Персонажи' : r.v === 'char' ? ch.name : `${ch.name} · ${lk.name}`;
  LifeShell.update({ title, back: r.v !== 'home' ? () => history.length > 1 ? history.back() : (location.hash = '#/') : false });
  if (r.v === 'home') { crumbs.style.display = 'none'; }
  else {
    crumbs.style.display = 'flex';
    const fdTxt = fd ? `${fdIcon(fd)} ${esc(fd.name)}` : 'Без фандома';
    crumbs.innerHTML = `<a href="#/">🎭 Косплей</a>›<a href="#/">${fdTxt}</a>›` +
      (r.v === 'char' ? `<b>${esc(ch.name)}</b>` : `<a href="#/c/${ch.id}">${esc(ch.name)}</a>›<b>${esc(lk.name)}</b>`);
  }
  fab.style.display = '';
  fab.textContent = r.v === 'home' ? '＋ Персонаж' : r.v === 'char' ? '＋ Образ' : '＋ Предмет';
  fab.onclick = () => r.v === 'home' ? charForm() : r.v === 'char' ? lookForm(null, ch.id) : addItemForm(lk.id);
  main.innerHTML = r.v === 'home' ? viewHome() : r.v === 'char' ? viewChar(ch, fd) : viewLook(ch, lk, fd);
  hydrate(main);
  main.scrollTop = 0;
}

// ───────── экраны ─────────
function viewHome() {
  if (!chars.length) return `<div class="empty"><div class="ico">🎭</div><div>Пока нет персонажей</div><button class="cb pri" onclick="charForm()">＋ Добавить первого</button></div>`;
  const groups = new Map();
  chars.forEach(c => { const k = c.fandomId && fandomById(c.fandomId) ? c.fandomId : ''; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(c); });
  const order = [...allFandoms().sort(byName).map(f => f.id).filter(id => groups.has(id)), ...(groups.has('') ? [''] : [])];
  return order.map(id => {
    const f = fandomById(id), list = groups.get(id).slice().sort(byName);
    return `<div class="fd-h"><span>${f ? fdIcon(f) : '🎭'}</span>${f ? esc(f.name) : 'Без фандома'}<i>${list.length}</i></div>
      <div class="char-grid">${list.map(c => {
        const p = charProgress(c.id);
        return `<a class="char-card" href="#/c/${c.id}">${ph('p34', 'cosplays', c.coverImageId, '🎭')}
          <div class="cc-b"><div class="cc-n">${esc(c.name)}</div>
          <div class="cc-s">${p.looks} ${p.looks === 1 ? 'образ' : 'образов'}${p.n ? ` · ${p.pct}%` : ''}</div>
          ${p.n ? `<div class="bar"><i style="width:${p.pct}%"></i></div>` : ''}</div></a>`;
      }).join('')}</div>`;
  }).join('');
}
function viewChar(ch, fd) {
  const ls = looks.filter(l => l.charId === ch.id);
  return `<div class="cp">
    <aside class="cp-side">
      <h1 class="cp-title">${esc(ch.name)}</h1>
      <div class="cp-photo">${ph('p34', 'cosplays', ch.coverImageId, '🎭')}</div>
      <div class="cp-meta">${fd ? fdIcon(fd) + ' ' + esc(fd.name) : 'Без фандома'}</div>
      <div class="cp-act"><button class="cb sm" onclick="charForm('${ch.id}')">✎ Изменить</button></div>
    </aside>
    <section>
      <div class="sec-h">Образы <span>${ls.length}</span></div>
      ${ls.length ? `<div class="look-list">${ls.map(l => {
        const p = lookProgress(l.id), first = (l.refImageIds || [])[0];
        return `<a class="look-card" href="#/c/${ch.id}/l/${l.id}">${ph('sq', 'cosplays', first, '✨')}
          <div class="lc-b"><div class="lc-n">${esc(l.name)}</div>
          <div class="lc-s">${p.n ? `${p.n} ${p.n === 1 ? 'предмет' : 'предметов'} · готово ${p.pct}%` : 'Предметов пока нет'}</div>
          ${p.n ? `<div class="bar"><i style="width:${p.pct}%"></i></div>` : ''}</div></a>`;
      }).join('')}</div>` : `<div class="empty"><div class="ico">✨</div><div>Образов пока нет</div></div>`}
    </section></div>`;
}
function viewLook(ch, lk, fd) {
  const refs = lk.refImageIds || [];
  const its = itemsOfLook(lk.id).map(itemView);
  const p = lookProgress(lk.id);
  const slotsHtml = SLOTS.map(s => {
    const here = its.filter(v => v.type.slot === s.id);
    const tiles = here.map(v => `<div class="tile st-${v.status}" onclick="showItem('${v.it.id}')"><div class="tw">${ph('sq', v.imgSlug, v.imgId, v.type.emoji)}${v.make ? '<span class="mk" title="Сделать самой">🛠</span>' : ''}</div>
        <div class="tile-n">${esc(v.name)}</div><div class="tile-p">${v.price != null ? money(v.price) : '&nbsp;'}</div></div>`).join('');
    const addTile = `<div class="tile add" onclick="addItemForm('${lk.id}','${(TYPES.find(t => t.slot === s.id) || TYPES[0]).tag}')" title="Добавить: ${esc(s.label)}"><div class="ph sq">＋</div></div>`;
    return `<div class="slot"><div class="slot-h">${s.emoji} ${s.label}</div><div class="slot-tiles">${tiles}${here.length ? '' : addTile}${here.length ? addTile : ''}</div></div>`;
  }).join('');
  return `<div class="cp">
    <aside class="cp-side">
      <h1 class="cp-title">${esc(ch.name)} · ${esc(lk.name)}</h1>
      <div class="cp-photo">${ph('p34', 'cosplays', refs[0], '✨')}</div>
      ${refs.length > 1 ? `<div class="cp-thumbs">${refs.slice(1).map(id => `<div onclick="openRef('${id}')">${ph('sq', 'cosplays', id, '')}</div>`).join('')}</div>` : ''}
      <div class="cp-meta">${p.n ? `Готово ${p.done} из ${p.n} (${p.pct}%)` : 'Добавьте первый предмет'}</div>
      ${lk.notes ? `<div class="cp-note">${esc(lk.notes)}</div>` : ''}
      <div class="cp-act"><button class="cb sm" onclick="lookForm('${lk.id}','${ch.id}')">✎ Изменить</button></div>

    <section><div class="inv">${slotsHtml}</div></section></div>`;
}
async function openRef(id) { const u = await imgUrl('cosplays', id); if (u) lightbox(u); }

// ───────── форма персонажа ─────────
function charForm(id) {
  const c = id ? chars.find(x => x.id === id) : null;
  let cover = null;
  let fdId = c && c.fandomId && fandomById(c.fandomId) ? c.fandomId : '';   // выбранный фандом
  let fdNew = null;                                                          // свой фандом {name, emoji}: создадим при сохранении
  openModal({
    title: c ? 'Персонаж' : 'Новый персонаж',
    body: field('Имя', `<input class="fi" id="cName" value="${esc(c ? c.name : '')}" placeholder="Имя персонажа" autocomplete="off">`) +
      field('Фандом', `<div class="fd-cur" id="fdCur"></div>
        <input class="fi" id="fdQ" placeholder="Найти фандом (Наруто, Ведьмак…) или создать свой" autocomplete="off">
        <div class="sug" id="fdList" style="max-height:190px;overflow:auto"></div>`) +
      field('Фото (портрет, обрежется по центру 3:4)', `<div class="up p34" id="cUp">${c && c.coverImageId ? `<img data-img="cosplays:${c.coverImageId}" alt="" class="ok">` : '<span>📷 Выбрать</span>'}</div><input type="file" id="cFile" accept="image/*" hidden>`),
    footer: (c ? '<button class="cb dng" id="cDel" type="button">Удалить</button>' : '') + '<button class="cb" data-x2 type="button">Отмена</button><button class="cb pri" id="cSave" type="button">Сохранить</button>',
  }, el => {
    const showCur = () => {
      const f = fdNew ? { emoji: fdNew.emoji, name: fdNew.name + ' (новый)' } : fandomById(fdId);
      $('fdCur').innerHTML = f ? `<span>${fdIcon(f)}</span><span>${esc(f.name)}</span><button type="button" class="ib" id="fdClear" title="Убрать фандом">✕</button>` : '<span class="others">Без фандома</span>';
      if ($('fdClear')) $('fdClear').onclick = () => { fdId = ''; fdNew = null; showCur(); };
    };
    const paintFd = () => {
      const raw = $('fdQ').value.trim(), q = raw.toLowerCase();
      const match = f => !q || String(f.name).toLowerCase().includes(q) || (f.aliases || []).some(x => String(x).toLowerCase().includes(q));
      const list = allFandoms().filter(match).sort((x, y) => (x.system - y.system) || byName(x, y)).slice(0, 40);
      const exact = allFandoms().some(f => String(f.name).toLowerCase() === q);
      let html = list.map(f => `<div class="sug-row" data-f="${f.id}"><span style="font-size:20px;width:26px;text-align:center">${fdIcon(f)}</span><div class="sug-t">${esc(f.name)}<small>${f.system ? esc(f.group || 'Каталог') : 'Мой фандом'}</small></div></div>`).join('');
      if (raw && !exact) html += `<div class="sug-row" data-new="1"><input class="fi" id="nfEmoji" value="✨" maxlength="4" style="width:56px;text-align:center;padding:6px" onclick="event.stopPropagation()"><div class="sug-t">＋ Создать свой фандом «${esc(raw)}»<small>У своего фандома — только эмодзи, без картинки</small></div></div>`;
      $('fdList').innerHTML = html || '<div class="others">Ничего не найдено</div>';
    };
    showCur(); paintFd();
    $('fdQ').oninput = paintFd;
    $('fdList').onclick = e => {
      const r = e.target.closest('[data-f],[data-new]'); if (!r) return;
      if (r.dataset.new) { fdNew = { name: $('fdQ').value.trim(), emoji: ($('nfEmoji').value.trim() || '✨') }; fdId = ''; }
      else { fdId = r.dataset.f; fdNew = null; }
      $('fdQ').value = ''; paintFd(); showCur();
    };
    $('cUp').onclick = () => $('cFile').click();
    $('cFile').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try { cover = await prepImage(f, 3 / 4, 1000); $('cUp').innerHTML = `<img src="${cover}" alt="">`; } catch (err) { toast(err.message); }
    };
    $('cSave').onclick = ev => lock(ev.currentTarget, async () => {
      const name = $('cName').value.trim(); if (!name) return toast('Введите имя');
      let fandomId = fdId || null;
      if (fdNew) { fandomId = upsert(fandoms, await DB.create('fandoms', { name: fdNew.name, emoji: fdNew.emoji })).id; fandoms.sort(byName); }
      let coverImageId = c ? c.coverImageId || null : null;
      if (cover) { const nid = await DB.saveImage(cover, { name: 'cover' }); if (coverImageId) await dropImg(coverImageId); coverImageId = nid; }
      const data = { name, fandomId, coverImageId };
      upsert(chars, c ? await DB.update('characters', c.id, data) : await DB.create('characters', data));
      closeModal(); render();
    });
    if (c) $('cDel').onclick = ev => lock(ev.currentTarget, async () => {
      if (!confirm(`Удалить «${c.name}» вместе с образами? Покупки останутся в модуле «Покупки».`)) return;
      for (const l of looks.filter(x => x.charId === c.id)) await removeLook(l, true);
      await dropImg(c.coverImageId);
      await DB.delete('characters', c.id); chars = chars.filter(x => x.id !== c.id);
      closeModal(); location.hash = '#/'; render();
    });
  });
}
async function removeLook(l, quiet) {
  for (const it of itemsOfLook(l.id)) { if (it.photoImageId) await dropImg(it.photoImageId); await DB.delete('items', it.id); }
  items = items.filter(i => i.lookId !== l.id);
  for (const id of l.refImageIds || []) await dropImg(id);
  await DB.delete('looks', l.id); looks = looks.filter(x => x.id !== l.id);
}

// ───────── форма образа ─────────
function lookForm(id, charId) {
  const l = id ? looks.find(x => x.id === id) : null;
  let refs = (l ? (l.refImageIds || []) : []).map(rid => ({ id: rid, data: null }));
  const draw = () => {
    $('refs').innerHTML = refs.map((r, i) => `<div class="ref">${r.data ? `<div class="ph p34"><img src="${r.data}" class="ok" alt=""></div>` : ph('p34', 'cosplays', r.id, '')}<button type="button" data-rm="${i}">✕</button></div>`).join('')
      + '<button type="button" class="ref-add" id="refAdd">＋</button>';
    hydrate($('refs'));
    $('refAdd').onclick = () => $('lFile').click();
  };
  openModal({
    title: l ? 'Образ' : 'Новый образ',
    body: field('Название образа', `<input class="fi" id="lName" value="${esc(l ? l.name : '')}" placeholder="Например: Бал, Базовый, Финальная форма" autocomplete="off">`) +
      field('Референсы (первое фото — главное, обрезается 3:4)', '<div class="refs" id="refs"></div><input type="file" id="lFile" accept="image/*" multiple hidden>') +
      field('Заметки', `<textarea class="fi" id="lNotes" placeholder="Необязательно">${esc(l ? l.notes || '' : '')}</textarea>`),
    footer: (l ? '<button class="cb dng" id="lDel" type="button">Удалить</button>' : '') + '<button class="cb" data-x2 type="button">Отмена</button><button class="cb pri" id="lSave" type="button">Сохранить</button>',
  }, el => {
    draw();
    $('refs').onclick = e => { const b = e.target.closest('[data-rm]'); if (b) { refs.splice(+b.dataset.rm, 1); draw(); } };
    $('lFile').onchange = async e => {
      for (const f of e.target.files) { try { refs.push({ id: null, data: await prepImage(f, 3 / 4, 1000) }); } catch (err) { toast(err.message); } }
      e.target.value = ''; draw();
    };
    $('lSave').onclick = ev => lock(ev.currentTarget, async () => {
      const name = $('lName').value.trim(); if (!name) return toast('Введите название образа');
      const ids = [];
      for (const r of refs) ids.push(r.id || await DB.saveImage(r.data, { name: 'reference' }));
      if (l) for (const old of (l.refImageIds || [])) if (!ids.includes(old)) await dropImg(old);
      const data = { name, notes: $('lNotes').value.trim() || null, refImageIds: ids };
      upsert(looks, l ? await DB.update('looks', l.id, data) : await DB.create('looks', { charId, ...data }));
      closeModal(); render();
    });
    if (l) $('lDel').onclick = ev => lock(ev.currentTarget, async () => {
      if (!confirm(`Удалить образ «${l.name}»? Покупки останутся в модуле «Покупки».`)) return;
      await removeLook(l); closeModal(); location.hash = '#/c/' + l.charId; render();
    });
  });
}

// ───────── добавить предмет: выбрать существующую покупку или создать новую ─────────
function addItemForm(lookId, presetTag) {
  let tag = presetTag || TYPES[0].tag;
  const inLook = new Set(itemsOfLook(lookId).map(i => i.purchaseId));
  openModal({
    title: 'Добавить предмет',
    body: field('Тип', `<div class="chips" id="aiTypes">${TYPES.map(t => `<button type="button" class="chip" data-t="${t.tag}">${t.emoji} ${t.label}</button>`).join('')}</div>`) +
      field('Название', '<input class="fi" id="aiName" placeholder="Например: парик каре блонд" autocomplete="off">') +
      '<div class="fl">Уже есть в покупках — можно выбрать</div><div class="sug" id="aiSug"></div>',
    footer: '<button class="cb" data-x2 type="button">Отмена</button><button class="cb" id="aiMake" type="button">🛠 Сделать самой</button><button class="cb pri" id="aiNew" type="button">Создать новую покупку</button>',
  }, el => {
    const paintTypes = () => el.querySelectorAll('#aiTypes .chip').forEach(b => b.classList.toggle('on', b.dataset.t === tag));
    const paintSug = () => {
      const q = $('aiName').value.trim().toLowerCase();
      const list = [...purchases.values()].filter(p => !inLook.has(p.id) && (!q || String(p.name).toLowerCase().includes(q)))
        .sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || ''))).slice(0, 8);
      $('aiSug').innerHTML = list.length ? list.map(p => {
        const vs = variants.get(p.id) || [], m = vs.find(v => v.isPrimary) || vs[0], im = vs.find(v => v.imageIds && v.imageIds[0]);
        const st = (STATUSES.find(s => s[0] === (p.status || 'wish')) || [, 'Хочу'])[1];
        return `<div class="sug-row" data-p="${p.id}">${ph('sq', PUR, im ? im.imageIds[0] : null, '🛍️')}<div class="sug-t">${esc(p.name)}<small>${st}${m && m.price != null ? ' · ' + money(m.price) : ''}</small></div><span class="cb sm">Выбрать</span></div>`;
      }).join('') : '<div class="others">Ничего похожего — создайте новую покупку кнопкой ниже.</div>';
    };
    paintTypes(); paintSug();
    $('aiTypes').onclick = e => { const b = e.target.closest('[data-t]'); if (b) { tag = b.dataset.t; paintTypes(); } };
    $('aiName').oninput = paintSug;
    $('aiSug').onclick = e => { const r = e.target.closest('[data-p]'); if (r) lock(r, () => linkItem(lookId, r.dataset.p, tag)); };
    $('aiMake').onclick = ev => lock(ev.currentTarget, async () => {
      const name = $('aiName').value.trim(); if (!name) return toast('Введите название');
      const it = await DB.create('items', { lookId, how: 'make', makeStatus: 'todo', name, tagIds: [tag] });
      items.push(it); closeModal(); render(); showItem(it.id);
    });
    $('aiNew').onclick = ev => lock(ev.currentTarget, async () => {
      const name = $('aiName').value.trim(); if (!name) return toast('Введите название');
      const p = await DB.create('purchases', { name, status: 'wish', priority: 0, tagIds: [tag], sourceType: 'cosplay' }, PUR);
      purchases.set(p.id, p);
      await linkItem(lookId, p.id, tag);
    });
  });
}
async function linkItem(lookId, purchaseId, tag) {
  const it = await DB.create('items', { lookId, purchaseId, tagIds: [tag] });
  items.push(it); closeModal(); render(); showItem(it.id);
}

// ───────── карточка предмета: статус, варианты (где купить), использование у других героев ─────────
let editVariant = null;   // null | 'new' | id варианта
function showItem(id, keepForm) {
  const it = items.find(x => x.id === id); if (!it) return;
  if (it.how === 'make') return showCraft(id);
  if (!keepForm) editVariant = null;
  const v = itemView(it), p = v.p;
  const others = items.filter(x => x.purchaseId === it.purchaseId && x.id !== it.id).map(x => {
    const l = looks.find(y => y.id === x.lookId), c = l && chars.find(y => y.id === l.charId);
    return l && c ? `<a href="#/c/${c.id}/l/${l.id}" onclick="closeModal()">${esc(c.name)} · ${esc(l.name)}</a>` : '';
  }).filter(Boolean);
  const shopName = sid => { const s = shops.find(x => x.id === sid); return s ? `${esc(s.logo || '🛍️')} ${esc(s.name)}` : ''; };
  const varsHtml = v.vs.map(x => `<div class="var-row${x.isPrimary ? ' pref' : ''}">
      <div data-vimg="${x.id}">${ph('sq', PUR, x.imageIds && x.imageIds[0], '🛍️')}</div>
      <div class="var-i" data-vedit="${x.id}">${esc(x.title || (shopName(x.shopId).replace(/<[^>]*>/g, '') || 'Вариант'))}<small>${[shopName(x.shopId), x.price != null ? money(x.price) : ''].filter(Boolean).join(' · ')}</small></div>
      <button type="button" class="ib${x.isPrimary ? ' on' : ''}" data-vstar="${x.id}" title="Основной вариант">★</button>
      ${x.url ? `<a class="ib" href="${esc(x.url)}" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center" title="Открыть ссылку">🔗</a>` : ''}
      <button type="button" class="ib" data-vdel="${x.id}" title="Удалить">✕</button></div>`).join('');
  const ev = editVariant && editVariant !== 'new' ? v.vs.find(x => x.id === editVariant) : null;
  const shopOpts = shops.map(s => `<option value="${s.id}"${ev && ev.shopId === s.id ? ' selected' : ''}>${esc(s.logo || '🛍️')} ${esc(s.name)}</option>`).join('');
  const formHtml = editVariant ? `<div class="fg" style="background:var(--bg3);border:1px solid var(--accent);border-radius:var(--r);padding:10px">
      <div class="row"><input class="fi" id="vTitle" placeholder="Название варианта (необязательно)" value="${esc(ev ? ev.title || '' : '')}"><input class="fi" id="vPrice" type="number" inputmode="decimal" placeholder="Цена" style="max-width:120px" value="${ev && ev.price != null ? ev.price : ''}"></div>
      <div class="row" style="margin-top:8px"><select class="fi" id="vShop"><option value="">— магазин —</option>${shopOpts}<option value="__new">＋ Новый магазин…</option></select></div>
      <input class="fi" id="vUrl" placeholder="Ссылка на товар" style="margin-top:8px" value="${esc(ev ? ev.url || '' : '')}">
      <div class="row" style="margin-top:8px;align-items:center"><div class="up sq" id="vUp" style="width:84px">${ev && ev.imageIds && ev.imageIds[0] ? `<img data-img="${PUR}:${ev.imageIds[0]}" class="ok" alt="">` : '<span>📷</span>'}</div><input type="file" id="vFile" accept="image/*" hidden>
        <div style="flex:1"></div><button class="cb sm" type="button" id="vCancel">Отмена</button><button class="cb sm pri" type="button" id="vSave">Сохранить</button></div></div>` : '';
  openModal({
    title: esc(v.name), lg: true,
    body: field('Название покупки', `<input class="fi" id="iName" value="${esc(p ? p.name : '')}" ${p ? '' : 'disabled'}>`) +
      field('Тип', `<div class="chips" id="iTypes">${TYPES.map(t => `<button type="button" class="chip${t.tag === (it.tagIds || [])[0] ? ' on' : ''}" data-t="${t.tag}">${t.emoji} ${t.label}</button>`).join('')}</div>`) +
      field('Статус', `<div class="chips" id="iStat">${STATUSES.map(([k, l]) => `<button type="button" class="chip${v.status === k ? ' on' : ''}" data-s="${k}">${l}</button>`).join('')}</div>`) +
      field('Где купить (варианты)', (varsHtml || '<div class="others" style="margin-bottom:8px">Вариантов пока нет — предмет в покупках «абстрактный».</div>') + formHtml +
        (editVariant ? '' : '<button class="cb sm" type="button" id="vAdd">＋ Добавить вариант</button>')) +
      field('Заметка к предмету в этом образе', `<textarea class="fi" id="iNotes" placeholder="Необязательно">${esc(it.notes || '')}</textarea>`) +
      (others.length ? field('Этот предмет также используется', `<div class="others">${others.join(' · ')}</div>`) : ''),
    footer: '<button class="cb dng" id="iUnlink" type="button">Убрать из образа</button><a class="cb" href="https://organizz-purchases.pages.dev/" target="_blank" rel="noopener">Открыть «Покупки»</a><button class="cb pri" data-x2 type="button">Готово</button>',
  }, el => {
    const reopen = () => { render(); showItem(id, true); };
    $('iName').onchange = e => lock(e.target, async () => {
      const name = e.target.value.trim(); if (!name || !p) return;
      purchases.set(p.id, await DB.update('purchases', p.id, { name }, PUR)); render();
    });
    $('iTypes').onclick = e => { const b = e.target.closest('[data-t]'); if (b) lock(b, async () => { upsert(items, await DB.update('items', it.id, { tagIds: [b.dataset.t] })); reopen(); }); };
    $('iStat').onclick = e => { const b = e.target.closest('[data-s]'); if (b && p) lock(b, async () => { purchases.set(p.id, await DB.update('purchases', p.id, { status: b.dataset.s }, PUR)); reopen(); }); };
    $('iNotes').onchange = e => lock(e.target, async () => { upsert(items, await DB.update('items', it.id, { notes: e.target.value.trim() || null })); });
    $('iUnlink').onclick = ev => lock(ev.currentTarget, async () => {
      if (!confirm('Убрать предмет из этого образа? Сама покупка останется в «Покупках» и в других образах.')) return;
      await DB.delete('items', it.id); items = items.filter(x => x.id !== it.id); closeModal(); render();
    });
    if ($('vAdd')) $('vAdd').onclick = () => { editVariant = 'new'; showItem(id, true); };
    el.querySelectorAll('[data-vedit]').forEach(b => b.onclick = () => { editVariant = b.dataset.vedit; showItem(id, true); });
    el.querySelectorAll('[data-vimg]').forEach(b => b.onclick = async () => { const x = v.vs.find(y => y.id === b.dataset.vimg); const u = x && x.imageIds && await imgUrl(PUR, x.imageIds[0]); if (u) lightbox(u); });
    el.querySelectorAll('[data-vstar]').forEach(b => b.onclick = () => lock(b, async () => {
      for (const x of v.vs) { const want = x.id === b.dataset.vstar; if (!!x.isPrimary !== want) upsertVar(await DB.update('purchase_variants', x.id, { isPrimary: want }, PUR)); }
      reopen();
    }));
    el.querySelectorAll('[data-vdel]').forEach(b => b.onclick = () => lock(b, async () => {
      const x = v.vs.find(y => y.id === b.dataset.vdel); if (!x || !confirm('Удалить вариант?')) return;
      await DB.delete('purchase_variants', x.id);
      for (const im of x.imageIds || []) await dropImg(im, PUR);
      variants.set(it.purchaseId, (variants.get(it.purchaseId) || []).filter(y => y.id !== x.id)); reopen();
    }));
    if (editVariant) {
      let newImg = null;
      $('vUp').onclick = () => $('vFile').click();
      $('vFile').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { newImg = await prepImage(f, 1, 900); $('vUp').innerHTML = `<img src="${newImg}" alt="">`; } catch (err) { toast(err.message); } };
      $('vCancel').onclick = () => { editVariant = null; showItem(id, true); };
      $('vShop').onchange = e => { if (e.target.value === '__new') lock(e.target, async () => {
        const nm = (prompt('Название магазина') || '').trim();
        if (!nm) { e.target.value = ''; return; }
        const s = await DB.create('shops', { name: nm, logo: '🛍️' }, PUR); shops.push(s); shops.sort(byName);
        editVariant = editVariant; showItem(id, true);
      }); };
      $('vSave').onclick = ev => lock(ev.currentTarget, async () => {
        const price = $('vPrice').value.trim() === '' ? null : parseFloat($('vPrice').value.replace(',', '.'));
        const patch = { title: $('vTitle').value.trim() || null, price: isFinite(price) ? price : null, shopId: ($('vShop').value && $('vShop').value !== '__new') ? $('vShop').value : null, url: $('vUrl').value.trim() || null };
        if (newImg) patch.imageIds = [await DB.saveImage(newImg, { name: 'variant-photo' }, PUR)];
        if (ev && editVariant !== 'new') {
          const old = v.vs.find(y => y.id === editVariant);
          upsertVar(await DB.update('purchase_variants', editVariant, patch, PUR));
          if (newImg && old) for (const im of old.imageIds || []) await dropImg(im, PUR);
        } else {
          const first = !(variants.get(it.purchaseId) || []).length;
          upsertVar(await DB.create('purchase_variants', { purchaseId: it.purchaseId, isPrimary: first, ...patch }, PUR));
        }
        editVariant = null; reopen();
      });
    }
  });
}
// карточка предмета «сделать самой»: название, тип, статус работы, фото, заметка
function showCraft(id) {
  const it = items.find(x => x.id === id); if (!it) return;
  let newImg = null;
  openModal({
    title: '🛠 ' + esc(it.name || 'Сделать самой'), lg: true,
    body: field('Название', `<input class="fi" id="mName" value="${esc(it.name || '')}">`) +
      field('Тип', `<div class="chips" id="mTypes">${TYPES.map(t => `<button type="button" class="chip${t.tag === (it.tagIds || [])[0] ? ' on' : ''}" data-t="${t.tag}">${t.emoji} ${t.label}</button>`).join('')}</div>`) +
      field('Статус работы', `<div class="chips" id="mStat">${MAKE_ST.map(([k, l]) => `<button type="button" class="chip${(it.makeStatus || 'todo') === k ? ' on' : ''}" data-s="${k}">${l}</button>`).join('')}</div>`) +
      field('Фото', `<div class="up sq" id="mUp" style="width:100px">${it.photoImageId ? `<img data-img="cosplays:${it.photoImageId}" class="ok" alt="">` : '<span>📷</span>'}</div><input type="file" id="mFile" accept="image/*" hidden>`) +
      field('Заметки (материалы, идеи, шаги)', `<textarea class="fi" id="mNotes" placeholder="Необязательно">${esc(it.notes || '')}</textarea>`),
    footer: '<button class="cb dng" id="mDel" type="button">Убрать из образа</button><button class="cb pri" data-x2 type="button">Готово</button>',
  }, el => {
    const save = async patch => { upsert(items, await DB.update('items', it.id, patch)); render(); };
    $('mName').onchange = e => lock(e.target, async () => { const n = e.target.value.trim(); if (n) await save({ name: n }); });
    $('mTypes').onclick = e => { const b = e.target.closest('[data-t]'); if (b) lock(b, async () => { await save({ tagIds: [b.dataset.t] }); showCraft(id); }); };
    $('mStat').onclick = e => { const b = e.target.closest('[data-s]'); if (b) lock(b, async () => { await save({ makeStatus: b.dataset.s }); showCraft(id); }); };
    $('mNotes').onchange = e => lock(e.target, () => save({ notes: e.target.value.trim() || null }));
    $('mUp').onclick = () => $('mFile').click();
    $('mFile').onchange = e => { const f = e.target.files[0]; if (f) lock(e.target, async () => {
      newImg = await prepImage(f, 1, 900);
      const nid = await DB.saveImage(newImg, { name: 'craft-photo' });
      if (it.photoImageId) await dropImg(it.photoImageId);
      await save({ photoImageId: nid }); showCraft(id);
    }); };
    $('mDel').onclick = ev => lock(ev.currentTarget, async () => {
      if (!confirm('Убрать предмет из образа?')) return;
      await dropImg(it.photoImageId); await DB.delete('items', it.id); items = items.filter(x => x.id !== it.id); closeModal(); render();
    });
  });
}
function upsertVar(rec) {
  const arr = variants.get(rec.purchaseId) || []; upsert(arr, rec); arr.sort(byCreated); variants.set(rec.purchaseId, arr);
}

// ───────── перенос данных первой версии (один раз, молча) ─────────
async function migrateLegacy() {
  let changed = false;
  try {
    for (const c of chars.filter(x => x.source && !x.fandomId)) {          // «источник» -> фандом
      const src = String(c.source).trim().toLowerCase();
      const sys = SYS_FANDOMS.find(f => String(f.name).toLowerCase() === src || (f.aliases || []).some(x => String(x).toLowerCase() === src));
      if (sys) { await DB.update('characters', c.id, { fandomId: sys.id, source: null }); changed = true; continue; }
      let f = fandoms.find(x => String(x.name).toLowerCase() === String(c.source).trim().toLowerCase());
      if (!f) { f = await DB.create('fandoms', { name: String(c.source).trim(), emoji: '✨' }); fandoms.push(f); }
      await DB.update('characters', c.id, { fandomId: f.id, source: null }); changed = true;
    }
    for (const it of items.filter(x => !x.purchaseId && x.name && x.how !== 'make')) {
      if (it.status === 'make') { await DB.update('items', it.id, { how: 'make', makeStatus: 'todo', status: null, variants: null, typeIdx: null }); changed = true; continue; }         // предмет с вложенными вариантами -> покупка
      const status = it.status === 'have' ? 'in_stock' : 'wish';
      const tagIds = [...(it.tagIds || [])]; if (it.status === 'make') tagIds.push('sys:src-make');
      const p = await DB.create('purchases', { name: it.name, status, priority: 0, tagIds, notes: it.notes || null, sourceType: 'cosplay' }, PUR);
      let first = true;
      for (const lv of it.variants || []) {
        const sname = lv.shop_name || lv.shopName || lv.shop || '';
        let s = sname && shops.find(x => String(x.name).toLowerCase() === String(sname).toLowerCase());
        if (sname && !s) { s = await DB.create('shops', { name: sname, logo: '🛍️' }, PUR); shops.push(s); }
        await DB.create('purchase_variants', { purchaseId: p.id, isPrimary: !!(lv.is_preferred ?? lv.isPreferred) || first, title: lv.title || null,
          price: lv.price != null && lv.price !== '' ? +lv.price : null, shopId: s ? s.id : null, url: lv.url || null }, PUR);
        first = false;
      }
      if (it.photoImageId) {                                              // фото предмета -> вариант в покупках
        try {
          const old = await DB.getImage(it.photoImageId); const blob = await (await fetch(old.data)).blob();
          const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
          const iid = await DB.saveImage(data, { name: 'variant-photo' }, PUR);
          await DB.create('purchase_variants', { purchaseId: p.id, isPrimary: first, title: null, price: null, imageIds: [iid] }, PUR);
        } catch (e) { console.warn('photo migrate', e); }
      }
      await DB.update('items', it.id, { purchaseId: p.id, name: null, variants: null, photoImageId: null, status: null, typeIdx: null }); changed = true;
    }
  } catch (e) { console.warn('[Косплей] перенос данных:', e); }
  return changed;
}

// ───────── запуск ─────────
(async function boot() {
  LifeShell.mount({ module: 'cosplays', title: 'Персонажи', actions: [] });
  $('main').innerHTML = '<div class="empty"><div class="ico">⏳</div><div>Загрузка…</div></div>';
  try { await lifeosInit(); } catch (e) { console.warn('[Косплей] lifeosInit:', e.message); }
  try {
    await loadAll();
    if (await migrateLegacy()) await loadAll();
  } catch (e) {
    $('main').innerHTML = `<div class="empty"><div class="ico">⚠️</div><div>Не удалось загрузить данные: ${esc(e.message)}</div><button class="cb" onclick="location.reload()">Повторить</button></div>`;
    return;
  }
  window.addEventListener('hashchange', render);
  render();
})();
</script>

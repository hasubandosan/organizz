<!DOCTYPE html>
<html lang="ru" data-module="cosplays">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0a0a0f"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Косплей — LifeOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://organizz-core.pages.dev/styles.css"/>
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { font-family: var(--f); }
    #app { display: flex; flex-direction: column; height: 100dvh; }



    .lo-header{flex:none}
    .scroll{flex:1;overflow-y:auto;padding:4px max(16px,calc((100% - var(--content-max))/2 + 16px)) 100px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
    .scroll::-webkit-scrollbar{width:3px}
    .scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

    .center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;height:220px;color:var(--text3)}
    .empty-ico{font-size:48px;opacity:.3}
    .empty-txt{font-size:13px;font-weight:600}
    @keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
    @keyframes slideR{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}

    .char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
    /* образы и предметы — в несколько колонок на широком экране */
    #mainContent.list-grid{display:grid !important;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px;align-items:start}
    #mainContent.list-grid > .look-card,#mainContent.list-grid > .item-card{margin-bottom:0}
    .char-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .2s,transform .15s;animation:pop .25s cubic-bezier(.16,1,.3,1) both;position:relative}
    .char-card:active{transform:scale(.95)}
    .char-card:hover{border-color:var(--purple)}
    .char-cover{width:100%;aspect-ratio:3/4;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:40px;position:relative;overflow:hidden}
    .char-cover img{width:100%;height:100%;object-fit:cover}
    .char-grad{position:absolute;bottom:0;left:0;right:0;height:60%;background:linear-gradient(to top,rgba(10,10,15,.95),transparent)}
    .char-info{position:absolute;bottom:0;left:0;right:0;padding:10px 12px}
    .char-name{font-size:14px;font-weight:700;line-height:1.2}
    .char-sub{font-size:11px;color:var(--text2);margin-top:2px}
    .char-prog-bar{position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--bg3)}
    .char-prog-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--accent2));transition:width .4s}

    .look-card{display:flex;align-items:center;gap:0;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;margin-bottom:8px;transition:border-color .15s,transform .1s;animation:slideR .22s cubic-bezier(.16,1,.3,1) both}
    .look-card:active{transform:scale(.98)}
    .look-thumb{width:80px;height:80px;flex-shrink:0;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden}
    .look-thumb img{width:100%;height:100%;object-fit:cover}
    .look-body{flex:1;min-width:0;padding:12px}
    .look-name{font-size:15px;font-weight:700;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .look-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .sc{padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700}
    .sc-planning{background:rgba(107,114,128,.15);color:#9ca3af}
    .sc-progress{background:rgba(240,128,80,.15);color:var(--orange)}
    .sc-ready{background:rgba(61,214,140,.15);color:var(--green)}
    .look-count{font-size:12px;color:var(--text3)}
    .look-prog{height:3px;background:var(--bg3);margin-top:7px;border-radius:3px;overflow:hidden}
    .look-prog-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--accent2))}

    .item-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;cursor:pointer;overflow:hidden;transition:border-color .15s;animation:pop .2s cubic-bezier(.16,1,.3,1) both}
    .item-inner{display:flex;align-items:flex-start;gap:12px;padding:12px}
    .item-thumb{width:62px;height:62px;flex-shrink:0;border-radius:8px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden}
    .item-thumb img{width:100%;height:100%;object-fit:cover}
    .item-body{flex:1;min-width:0}
    .item-name{font-size:14px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .item-type{font-size:12px;color:var(--text3);margin-bottom:5px}
    .item-st{padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700}
    .is-have{background:rgba(61,214,140,.12);color:var(--green)}
    .is-buy{background:rgba(160,112,240,.12);color:var(--purple)}
    .is-make{background:rgba(103,232,249,.12);color:var(--cyan)}
    .vars-strip{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto;scrollbar-width:none}
    .vars-strip::-webkit-scrollbar{display:none}
    .var-chip{flex-shrink:0;display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;background:var(--bg3);border:1px solid var(--border2);font-size:12px;color:var(--text3);text-decoration:none;transition:border-color .15s,color .15s}
    .var-chip:hover{border-color:var(--purple);color:var(--text)}
    .var-chip.pref{border-color:var(--purple);color:var(--purple)}
    .var-price{font-weight:700}

    .fab{position:fixed;bottom:calc(20px + var(--sb));right:max(18px,calc((100vw - var(--content-max))/2 + 18px));width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(160,112,240,.45);transition:transform .15s;z-index:20}
    .fab:active{transform:scale(.9)}
    .edit-btn{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;z-index:3}
    .look-card{position:relative}
    .look-card .edit-btn{top:50%;transform:translateY(-50%)}
    .btn-rm{width:100%;padding:8px;margin-top:6px;border:1px dashed var(--border2);color:var(--text3);border-radius:var(--r2);font-size:12px}
    .pu-badge{display:inline-block;margin-left:6px;font-size:11px;color:var(--purple)}

    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(6px)}
    .overlay.on{opacity:1;pointer-events:all}
    .sheet{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-radius:16px 16px 0 0;border-top:1px solid var(--border2);z-index:101;max-height:88dvh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.16,1,.3,1)}
    /* от 720px — аккуратное окно по центру, а не шторка на всю ширину */
    @media(min-width:720px){
      .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(520px,calc(100% - 48px));max-height:min(86dvh,820px);border:1px solid var(--border2);border-radius:16px;
        transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:transform .2s,opacity .2s}
      .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:all}
      .sheet-drag{display:none}
    }
    .sheet.on{transform:translateY(0)}
    .sheet-drag{width:36px;height:4px;background:var(--border2);border-radius:4px;margin:12px auto 0;flex-shrink:0}
    .sheet-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;flex-shrink:0}
    .sheet-title{font-size:16px;font-weight:700}
    .close-btn{width:30px;height:30px;border-radius:8px;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:16px}
    .sheet-body{overflow-y:auto;padding:0 16px calc(12px + var(--sb));flex:1}

    .fg{margin-bottom:14px}
    .fl{display:block;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
    .fi{width:100%;padding:11px 13px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);font-size:14px;color:var(--text);transition:border-color .15s}
    .fi:focus{border-color:var(--accent)}
    .fi::placeholder{color:var(--text3)}
    textarea.fi{resize:vertical;min-height:70px}
    select.fi{cursor:pointer;appearance:none}
    .frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

    .img-up{width:100%;height:130px;border-radius:var(--r2);border:1.5px dashed var(--border2);background:var(--bg3);display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text3);font-size:13px;cursor:pointer;position:relative;overflow:hidden;transition:border-color .15s}
    .img-up:hover{border-color:var(--accent)}
    .img-up img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .img-mask{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:13px;opacity:0;transition:opacity .15s}
    .img-up:hover .img-mask{opacity:1}

    .pill-sel{display:flex;gap:6px;flex-wrap:wrap}
    .pill-opt{padding:8px 14px;border-radius:100px;font-size:12px;font-weight:700;border:1px solid var(--border2);background:var(--bg3);color:var(--text3);transition:all .15s;cursor:pointer}
    .pill-opt.on-planning{background:rgba(107,114,128,.15);color:#9ca3af;border-color:#4b5563}
    .pill-opt.on-progress{background:rgba(240,128,80,.15);color:var(--orange);border-color:var(--orange)}
    .pill-opt.on-ready{background:rgba(61,214,140,.15);color:var(--green);border-color:var(--green)}
    .pill-opt.on-have{background:rgba(61,214,140,.12);color:var(--green);border-color:var(--green)}
    .pill-opt.on-buy{background:rgba(160,112,240,.12);color:var(--purple);border-color:var(--purple)}
    .pill-opt.on-make{background:rgba(103,232,249,.12);color:var(--cyan);border-color:var(--cyan)}

    .refs-wrap{display:flex;gap:8px;flex-wrap:wrap}
    .ref-thumb{width:70px;height:70px;border-radius:8px;overflow:hidden;position:relative;background:var(--bg3);flex-shrink:0}
    .ref-thumb img{width:100%;height:100%;object-fit:cover}
    .ref-del{position:absolute;top:2px;right:2px;width:18px;height:18px;background:rgba(0,0,0,.7);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;cursor:pointer}
    .ref-add{width:70px;height:70px;border-radius:8px;border:1.5px dashed var(--border2);background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--text3);cursor:pointer;transition:border-color .15s,color .15s;flex-shrink:0}
    .ref-add:hover{border-color:var(--accent);color:var(--accent2)}
    .vars-editor{display:flex;flex-direction:column;gap:8px}
    .var-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2)}
    .var-row.pref{border-color:var(--purple)}
    .var-fields{flex:1;display:flex;flex-direction:column;gap:6px}
    .var-fields input{font-size:13px;background:var(--bg4);padding:6px 10px;border-radius:6px;border:1px solid var(--border2);color:var(--text);width:100%}
    .var-fields input:focus{border-color:var(--accent);outline:none}
    .var-right{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0}
    .star-btn{font-size:18px;opacity:.35;transition:opacity .15s;cursor:pointer}
    .star-btn.on{opacity:1}
    .del-var{font-size:18px;color:var(--text3);cursor:pointer;transition:color .15s}
    .del-var:hover{color:var(--red)}
    .btn-add-var{width:100%;padding:10px;border:1.5px dashed var(--border2);border-radius:var(--r2);font-size:13px;font-weight:600;color:var(--text3);transition:all .15s;cursor:pointer}
    .btn-add-var:hover{border-color:var(--accent);color:var(--accent2)}
    .btn-save{width:100%;padding:14px;background:var(--accent);color:var(--on-accent);border-radius:var(--r);font-size:14px;font-weight:700;transition:transform .1s,opacity .15s;margin-top:6px;position:sticky;bottom:0;box-shadow:0 -14px 14px -8px var(--bg2)}
    .btn-save:active{transform:scale(.98)}
    .btn-save:disabled{opacity:.4;pointer-events:none}
    .btn-del{width:100%;padding:12px;border:1px solid rgba(240,80,96,.25);color:var(--red);border-radius:var(--r2);font-size:13px;font-weight:600;transition:background .15s;margin-top:6px;cursor:pointer}
    .btn-del:hover{background:rgba(240,80,96,.08)}
  </style>
</head>
<body>
<div id="app">
  <div class="nav"></div>
  <div class="scroll">
    <div class="center" id="loadingEl"><div class="spinner"></div></div>
    <div id="mainContent" style="display:none"></div>
    <div class="center" id="emptyEl" style="display:none">
      <div class="empty-ico">🎭</div>
      <div class="empty-txt">Пусто — нажми +</div>
    </div>
  </div>
  <button class="fab" id="fabAdd">+</button>
</div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="formSheet">
  <div class="sheet-drag"></div>
  <div class="sheet-hdr">
    <div class="sheet-title" id="formTitle"></div>
    <button class="close-btn" id="formClose">✕</button>
  </div>
  <div class="sheet-body" id="formBody"></div>
</div>

<div class="toast" id="toastEl"></div>

<script>window.LIFEOS_APP_SLUG = 'cosplays';</script>
<script src="https://organizz-core.pages.dev/db.js"></script>
<script src="https://organizz-core.pages.dev/nav.js"></script>
<script src="https://organizz-core.pages.dev/shell.js"></script>
<script>window.LifeShell = window.LifeShell || { mount() {}, update() {} };  /* core ещё не обновлён — без шапки, но без падения */</script>
<script src="https://organizz-core.pages.dev/ui.js"></script>
<script>
'use strict';

// Единая шапка: логотип/модуль и переключатель рисует LifeShell; заголовок экрана и «назад» обновляет setView()
LifeShell.mount({ module: 'cosplays', replace: '.nav', title: 'Персонажи', actions: [
  { id: 'btnSync', icon: '⟳', label: 'Обновить', onClick: function(){ syncNow(); } },
] });

function esc(s) {
  const a = '&' + 'amp;';
  const l = '&' + 'lt;';
  const g = '&' + 'gt;';
  const q = '&' + 'quot;';
  return String(s||'').replace(/&/g, a).replace(/</g, l).replace(/>/g, g).replace(/"/g, q);
}

function fmtP(n) {
  if (n == null || n === '') return '';
  return Number(n).toLocaleString('ru-RU') + ' ₽';
}

// ----- STATE -----
var view = 'chars';
var curChar = null;
var curLook = null;
var characters = [];
var looks = [];
var items = [];
var itemTypes = [];

// form state
var _editId = null;
var _variantsDraft = [];
var _refsDraft = [];
var _coverData = null;
var _photoData = null;
var _coverRemoved = false, _photoRemoved = false;
var _coverNew = false, _photoNew = false;   // true — выбрана НОВАЯ картинка (её надо загрузить в хранилище)
var _refsIdBySrc = {};                       // url референса -> id картинки (для уже сохранённых)

const TYPE_NAMES = ['💇 Причёска','👠 Обувь','👗 Одежда','💍 Аксессуары','💄 Грим','⚔️ Реквизит'];
const TYPE_EMOJIS = ['💇','👠','👗','💍','💄','⚔️'];
// Тип предмета = системный тег «Элемент образа» (см. docs/TAGS_AND_REFS.md); в записи хранится tagIds
const TYPE_TAGS = ['sys:cp-wig','sys:cp-shoes','sys:cp-dress','sys:cp-accessory','sys:cp-makeup','sys:cp-artifact'];

// ----- LOAD (from core DB) -----
function byCreated(a, b) { return String(a.createdAt || '').localeCompare(String(b.createdAt || '')); }
async function _imgUrl(id) {
  if (!id) return null;
  try { var r = await DB.getImage(id); return r && r.data ? r.data : null; } catch (e) { return null; }
}
async function dropImages(ids) {
  for (var i = 0; i < ids.length; i++) { if (ids[i]) { try { await DB.deleteImage(ids[i]); } catch (e) {} } }
}
var PU = 'purchases';
function puRefId(x) { var r = (x.refs || []).filter(function(r){ return r.module === 'purchases'; })[0]; return r ? r.id : null; }
// прогресс образа = доля предметов «Уже есть»; прогресс персонажа = среднее по его образам
async function recalcProgress(charId, lookId) {
  try {
    if (lookId) {
      var its = (await DB.getAll('items')).filter(function(x){ return x.lookId === lookId; });
      var p = its.length ? Math.round(its.filter(function(x){ return x.status === 'have'; }).length * 100 / its.length) : 0;
      await DB.update('looks', lookId, {progress: p});
    }
    var ls = (await DB.getAll('looks')).filter(function(l){ return l.charId === charId; });
    var cp = ls.length ? Math.round(ls.reduce(function(a, l){ return a + (l.progress || 0); }, 0) / ls.length) : 0;
    await DB.update('characters', charId, {progress: cp});
  } catch (e) {}
}
async function removeItemCascade(item) {
  await dropImages([item.photoImageId]);
  var pid = puRefId(item);
  if (pid) {   // непокупленную покупку убираем вместе с предметом, купленную оставляем как историю
    try { var pu = await DB.getById('purchases', pid, PU); if (pu && pu.status !== 'in_stock') await DB.delete('purchases', pid, PU); } catch (e) {}
  }
  await DB.delete('items', item.id);
}
async function removeLookCascade(look) {
  var its = (await DB.getAll('items')).filter(function(x){ return x.lookId === look.id; });
  for (var i = 0; i < its.length; i++) await removeItemCascade(its[i]);
  await dropImages(look.refImageIds || []);
  await DB.delete('looks', look.id);
}
async function removeCharCascade(char) {
  var ls = (await DB.getAll('looks')).filter(function(l){ return l.charId === char.id; });
  for (var i = 0; i < ls.length; i++) await removeLookCascade(ls[i]);
  await dropImages([char.coverImageId]);
  await DB.delete('characters', char.id);
}
// «Купить» -> покупка в модуле «Покупки», связь refs с обеих сторон
async function syncPurchase(item) {
  var pid = puRefId(item);
  if (item.status !== 'buy') return;
  var tag = (item.tagIds || [])[0];
  if (pid) {
    try { await DB.update('purchases', pid, {name: item.name, notes: item.notes || null}, PU); return; } catch (e) { /* покупку удалили — создадим заново */ }
  }
  var rec = await DB.create('purchases', {
    name: item.name, status: 'wish', priority: 1, tags: [], tagIds: tag ? [tag] : [], notes: item.notes || null,
    sourceType: 'cosplay',
    refs: [{module: 'cosplays', type: 'items', id: item.id}]
  }, PU);
  var refs = (item.refs || []).filter(function(r){ return r.module !== 'purchases'; });
  refs.push({module: 'purchases', type: 'purchases', id: rec.id});
  await DB.update('items', item.id, {refs: refs});
}
async function loadCharacters() {
  characters = (await DB.getAll('characters')).sort(byCreated);
  await Promise.all(characters.map(async function(c) { c._coverUrl = await _imgUrl(c.coverImageId); }));
  return characters;
}
async function loadLooks(charId) {
  looks = (await DB.getAll('looks')).filter(function(l) { return l.charId === charId; }).sort(byCreated);
  await Promise.all(looks.map(async function(l) {
    var ids = l.refImageIds || [];
    var urls = await Promise.all(ids.map(_imgUrl));
    l._refIds = []; l._refUrls = [];
    ids.forEach(function(id, i) { if (urls[i]) { l._refIds.push(id); l._refUrls.push(urls[i]); } });
  }));
  return looks;
}
async function loadItems(lookId) {
  items = (await DB.getAll('items')).filter(function(x) { return x.lookId === lookId; }).sort(byCreated);
  var allPu = []; try { allPu = await DB.getAll('purchases', PU); } catch (e) {}
  for (var k = 0; k < items.length; k++) {
    var pid = puRefId(items[k]);
    items[k]._pu = pid ? (allPu.filter(function(q){ return q.id === pid; })[0] || null) : null;
    if (items[k]._pu && items[k]._pu.status === 'in_stock' && items[k].status === 'buy') {
      items[k].status = 'have';
      try { await DB.update('items', items[k].id, {status: 'have'}); } catch (e) {}
    }
  }
  await Promise.all(items.map(async function(x) {
    x._photoUrl = await _imgUrl(x.photoImageId);
    var ti = TYPE_TAGS.indexOf((x.tagIds || [])[0]);
    x.typeIdx = ti >= 0 ? ti : 0;
  }));
  return items;
}

// ----- NAV -----
function goBack() {
  if (view === 'items') gotoLooks(curChar);
  else if (view === 'looks') gotoChars();
}
function setView(v) {
  view = v;
  var list = document.getElementById('mainContent');
  list.classList.toggle('list-grid', v !== 'chars');
  if (v === 'chars') {
    LifeShell.update({ title: 'Персонажи', back: false });
  } else if (v === 'looks') {
    LifeShell.update({ title: curChar.name + ' / Образы', back: goBack });
  } else {
    LifeShell.update({ title: curChar.name + ' / ' + curLook.name, back: goBack });
  }
}

async function gotoChars() {
  showLoading();
  curChar = null; curLook = null;
  setView('chars');
  await loadCharacters();
  renderChars();
}
async function gotoLooks(char) {
  showLoading();
  curChar = char; curLook = null;
  setView('looks');
  await loadLooks(char.id);
  renderLooks();
}
async function gotoItems(look) {
  showLoading();
  curLook = look;
  setView('items');
  await loadItems(look.id);
  renderItems();
}

// ----- RENDER HELPERS -----
function showLoading() {
  document.getElementById('loadingEl').style.display = 'flex';
  document.getElementById('mainContent').style.display = 'none';
  document.getElementById('emptyEl').style.display = 'none';
}
function showContent(html) {
  document.getElementById('loadingEl').style.display = 'none';
  if (!html) {
    document.getElementById('emptyEl').style.display = 'flex';
    document.getElementById('mainContent').style.display = 'none';
    return;
  }
  document.getElementById('mainContent').innerHTML = html;
  document.getElementById('mainContent').style.display = 'block';
  document.getElementById('emptyEl').style.display = 'none';
}
function toast(msg, type) {
  if (window.UI) { UI.toast(msg, type === 'err' ? 'err' : 'ok'); return; }
  var el = document.getElementById('toastEl');
  if (!el) return;
  el.textContent = msg;
  el.className = 'toast on ' + (type||'');
  setTimeout(function(){ el.classList.remove('on'); }, 2500);
}

function renderChars() {
  if (!characters.length) { showContent(''); return; }
  var html = '<div class="char-grid">' + characters.map(function(c, idx) {
    return '<div class="char-card" data-id="'+c.id+'" style="animation-delay:'+idx*.04+'s">'
      + '<div class="char-cover">'
      + (c._coverUrl ? '<img src="'+esc(c._coverUrl)+'" loading="lazy"/>' : '🎭')
      + '<div class="char-grad"></div><button class="edit-btn" data-edit="'+c.id+'">✎</button>'
      + '<div class="char-info"><div class="char-name">'+esc(c.name)+'</div>'
      + (c.source ? '<div class="char-sub">'+esc(c.source)+'</div>' : '')
      + '</div></div>'
      + '<div class="char-prog-bar"><div class="char-prog-fill" style="width:'+(c.progress||0)+'%"></div></div>'
      + '</div>';
  }).join('') + '</div>';
  showContent(html);
  document.getElementById('mainContent').querySelectorAll('.char-card .edit-btn').forEach(function(b) {
    b.addEventListener('click', function(e) { e.stopPropagation(); openEditChar(b.dataset.edit); });
  });
  document.getElementById('mainContent').querySelectorAll('.char-card').forEach(function(el) {
    el.addEventListener('click', function() {
      gotoLooks(characters.find(function(c){return c.id===el.dataset.id;}));
    });
    el.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      openEditChar(el.dataset.id);
    });
  });
}

function renderLooks() {
  if (!looks.length) { showContent(''); return; }
  var html = looks.map(function(l, idx) {
    var scCls = l.status==='ready' ? 'sc-ready' : l.status==='progress' ? 'sc-progress' : 'sc-planning';
    var scTxt = l.status==='ready' ? 'Готов' : l.status==='progress' ? 'В процессе' : 'Планирую';
    var thumb = (l._refUrls && l._refUrls[0]) ? '<img src="'+esc(l._refUrls[0])+'" loading="lazy"/>' : '✨';
    return '<div class="look-card" data-id="'+l.id+'" style="animation-delay:'+idx*.04+'s">'
      + '<button class="edit-btn" data-edit="'+l.id+'">✎</button>'
      + '<div class="look-thumb">'+thumb+'</div>'
      + '<div class="look-body">'
      + '<div class="look-name">'+esc(l.name)+'</div>'
      + '<div class="look-meta"><span class="sc '+scCls+'">'+scTxt+'</span></div>'
      + '<div class="look-prog"><div class="look-prog-fill" style="width:'+(l.progress||0)+'%"></div></div>'
      + '</div></div>';
  }).join('');
  showContent(html);
  document.getElementById('mainContent').querySelectorAll('.look-card .edit-btn').forEach(function(b) {
    b.addEventListener('click', function(e) { e.stopPropagation(); openEditLook(b.dataset.edit); });
  });
  document.getElementById('mainContent').querySelectorAll('.look-card').forEach(function(el) {
    el.addEventListener('click', function() {
      gotoItems(looks.find(function(l){return l.id===el.dataset.id;}));
    });
    el.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      openEditLook(el.dataset.id);
    });
  });
}

function renderItems() {
  if (!items.length) { showContent(''); return; }
  var html = items.map(function(item, idx) {
    var typeName = TYPE_NAMES[item.typeIdx] || '📦';
    var isCls = item.status==='have' ? 'is-have' : item.status==='make' ? 'is-make' : 'is-buy';
    var isTxt = item.status==='have' ? 'Уже есть' : item.status==='make' ? 'Шить/делать' : 'Купить';
    var vars = item.variants || [];
    var varHtml = vars.length ? '<div class="vars-strip">'
      + vars.map(function(v){
          return '<a class="var-chip'+(v.is_preferred?' pref':'')+'" href="'+esc(v.url||'#')+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'
            + esc(v.shop_name||'Магазин')
            + (v.price ? ' · <span class="var-price">'+fmtP(v.price)+'</span>' : '')
            + (v.is_preferred ? ' ⭐' : '')
            + '</a>';
        }).join('')
      + '</div>' : '';
    var thumb = item._photoUrl ? '<img src="'+esc(item._photoUrl)+'" loading="lazy"/>' : (TYPE_EMOJIS[item.typeIdx] || '📦');
    return '<div class="item-card" data-id="'+item.id+'" style="animation-delay:'+idx*.03+'s">'
      + '<div class="item-inner">'
      + '<div class="item-thumb">'+thumb+'</div>'
      + '<div class="item-body">'
      + '<div class="item-name">'+esc(item.name)+'</div>'
      + '<div class="item-type">'+typeName+'</div>'
      + '<span class="item-st '+isCls+'">'+isTxt+'</span>'
      + (item._pu ? '<span class="pu-badge">🛒 '+(item._pu.status==='in_stock'?'куплено':item._pu.status==='ordered'?'заказано':'в Покупках')+'</span>' : '')
      + '</div></div>'
      + varHtml + '</div>';
  }).join('');
  showContent(html);
  document.getElementById('mainContent').querySelectorAll('.item-card').forEach(function(el) {
    el.addEventListener('click', function() { openEditItem(el.dataset.id); });
  });
}

// ----- SHEET -----
function openSheet(title) {
  document.getElementById('formTitle').textContent = title;
  document.getElementById('overlay').classList.add('on');
  document.getElementById('formSheet').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeSheet() {
  document.getElementById('overlay').classList.remove('on');
  document.getElementById('formSheet').classList.remove('on');
  document.body.style.overflow = '';
  _editId=null; _variantsDraft=[]; _refsDraft=[]; _coverData=null; _photoData=null;
}

// ----- CHAR FORM -----
function openAddChar()   { buildCharForm(null); }
function openEditChar(id){ buildCharForm(characters.find(function(c){return c.id===id;})||null); }
function buildCharForm(char) {
  _editId = char ? char.id : null;
  _coverData = char ? (char._coverUrl||null) : null; _coverNew = false; _coverRemoved = false;
  openSheet(char ? 'Редактировать персонажа' : 'Новый персонаж');
  var delBtn = char ? '<button class="btn-del" id="fDelBtn">Удалить персонажа</button>' : '';
  document.getElementById('formBody').innerHTML =
    '<div class="fg"><label class="fl">Обложка</label>'
    + '<div class="img-up" id="fImgUp">'
    + '<span id="fImgLbl">🎭 Добавить фото</span>'
    + (_coverData ? '<img id="fImgEl" src="'+esc(_coverData)+'"/>' : '<img id="fImgEl" style="display:none"/>')
    + '<div class="img-mask">🔄 Заменить</div></div>'
    + '<input type="file" id="fImgInput" accept="image/*" style="display:none"/>'
    + (_coverData ? '<button type="button" class="btn-rm" id="fImgRm">Убрать обложку</button>' : '') + '</div>'
    + '<div class="fg"><label class="fl">Имя *</label>'
    + '<input id="fCharName" class="fi" placeholder="Nezuko, Zero Two..." value="'+esc(char?char.name:'')+'"/></div>'
    + '<div class="fg"><label class="fl">Источник</label>'
    + '<input id="fCharSource" class="fi" placeholder="Аниме, игра, манга..." value="'+esc(char?char.source:'')+'"/></div>'
    + '<button class="btn-save" id="fSaveBtn">Сохранить</button>'
    + delBtn;
  if (_coverData) document.getElementById('fImgLbl').style.display='none';
  document.getElementById('fImgUp').addEventListener('click', function(){ document.getElementById('fImgInput').click(); });
  var rmC = document.getElementById('fImgRm');
  if (rmC) rmC.addEventListener('click', function(){
    _coverData = null; _coverNew = false; _coverRemoved = true;
    var img = document.getElementById('fImgEl'); img.style.display = 'none'; img.removeAttribute('src');
    document.getElementById('fImgLbl').style.display = ''; rmC.style.display = 'none';
  });
  document.getElementById('fImgInput').addEventListener('change', function(e){
    var f=e.target.files[0]; if(!f) return;
    var r=new FileReader(); r.onload=function(ev){
      _coverData=ev.target.result; _coverNew=true;
      var img=document.getElementById('fImgEl'); img.src=_coverData; img.style.display='block';
      document.getElementById('fImgLbl').style.display='none';
    }; r.readAsDataURL(f);
  });
  document.getElementById('fSaveBtn').addEventListener('click', async function(){
    var name=document.getElementById('fCharName').value.trim();
    if(!name){toast('Введи имя','err');return;}
    document.getElementById('fSaveBtn').disabled=true; document.getElementById('fSaveBtn').textContent='Сохранение...';
    try {
      var coverImageId = char ? (char.coverImageId||null) : null;
      if (_coverRemoved && coverImageId) { await dropImages([coverImageId]); coverImageId = null; }
      if (_coverNew && _coverData) {
        var newCover = await DB.saveImage(_coverData);
        if (coverImageId) await dropImages([coverImageId]);
        coverImageId = newCover;
      }
      if (_editId) {
        await DB.update('characters', _editId, {name:name, source:document.getElementById('fCharSource').value.trim()||null, coverImageId:coverImageId});
      } else {
        await DB.create('characters', {name:name, source:document.getElementById('fCharSource').value.trim()||null, coverImageId:coverImageId, progress:0});
      }
      await loadCharacters(); renderChars(); closeSheet(); toast(char?'Обновлено ✓':'Добавлено ✓','ok');
    } catch(e){ toast('Ошибка: '+e.message,'err'); }
    finally { var btn=document.getElementById('fSaveBtn'); if(btn){btn.disabled=false;btn.textContent='Сохранить';} }
  });
  if(char) document.getElementById('fDelBtn').addEventListener('click', async function(){
    if(!confirm('Удалить персонажа вместе со всеми его образами и предметами?')) return;
    try{ await removeCharCascade(char); await loadCharacters(); renderChars(); closeSheet(); toast('Удалено','ok'); }
    catch(e){ toast('Ошибка: '+e.message,'err'); }
  });
}

// ----- LOOK FORM -----
function openAddLook()   { buildLookForm(null); }
function openEditLook(id){ buildLookForm(looks.find(function(l){return l.id===id;})||null); }
function buildLookForm(look) {
  _editId = look ? look.id : null;
  _refsDraft = look ? (look._refUrls||[]).slice() : [];
  _refsIdBySrc = {};
  if (look) (look._refUrls||[]).forEach(function(u,i){ _refsIdBySrc[u] = (look._refIds||[])[i]; });
  var lookStatus = look ? look.status||'planning' : 'planning';
  openSheet(look ? 'Редактировать образ' : 'Новый образ');
  var delBtn = look ? '<button class="btn-del" id="fDelBtn">Удалить образ</button>' : '';
  document.getElementById('formBody').innerHTML =
    '<div class="fg"><label class="fl">Название *</label>'
    + '<input id="fLookName" class="fi" placeholder="Школьная форма, боевой..." value="'+esc(look?look.name:'')+'"/></div>'
    + '<div class="fg"><label class="fl">Статус</label>'
    + '<div class="pill-sel" id="fLookStatus">'
    + '<button class="pill-opt" data-v="planning">Планирую</button>'
    + '<button class="pill-opt" data-v="progress">В процессе</button>'
    + '<button class="pill-opt" data-v="ready">Готов</button>'
    + '</div></div>'
    + '<div class="fg"><label class="fl">Референс-фото</label>'
    + '<div class="refs-wrap" id="fRefsWrap"></div>'
    + '<input type="file" id="fRefInput" accept="image/*" multiple style="display:none"/></div>'
    + '<div class="fg"><label class="fl">Заметки</label>'
    + '<textarea id="fLookNotes" class="fi" placeholder="Детали, нюансы...">'+esc(look?look.notes||'':'')+'</textarea></div>'
    + '<button class="btn-save" id="fSaveBtn">Сохранить</button>'
    + delBtn;
  function syncStatus(){
    document.getElementById('fLookStatus').querySelectorAll('.pill-opt').forEach(function(b){
      b.className='pill-opt';
      if(b.dataset.v===lookStatus) b.classList.add('on-'+lookStatus);
    });
  }
  syncStatus();
  document.getElementById('fLookStatus').addEventListener('click', function(e){
    var b=e.target.closest('.pill-opt'); if(!b) return;
    lookStatus=b.dataset.v; syncStatus();
  });
  function renderRefs(){
    var wrap=document.getElementById('fRefsWrap');
    wrap.innerHTML = _refsDraft.map(function(url,i){
      return '<div class="ref-thumb"><img src="'+esc(url)+'"/><div class="ref-del" data-i="'+i+'">×</div></div>';
    }).join('') + '<div class="ref-add" id="fRefAddBtn">＋</div>';
    wrap.querySelectorAll('.ref-del').forEach(function(btn){
      btn.addEventListener('click',function(){ _refsDraft.splice(+btn.dataset.i,1); renderRefs(); });
    });
    document.getElementById('fRefAddBtn').addEventListener('click',function(){ document.getElementById('fRefInput').click(); });
  }
  renderRefs();
  document.getElementById('fRefInput').addEventListener('change', function(e){
    var files=Array.from(e.target.files);
    files.forEach(function(f){
      var rd=new FileReader(); rd.onload=function(ev){ _refsDraft.push(ev.target.result); renderRefs(); }; rd.readAsDataURL(f);
    });
  });
  document.getElementById('fSaveBtn').addEventListener('click', async function(){
    var name=document.getElementById('fLookName').value.trim();
    if(!name){toast('Введи название','err');return;}
    document.getElementById('fSaveBtn').disabled=true; document.getElementById('fSaveBtn').textContent='Сохранение...';
    try{
      var keepIds = [];
      for (var ri = 0; ri < _refsDraft.length; ri++) {
        var rs = _refsDraft[ri];
        keepIds.push(_refsIdBySrc[rs] ? _refsIdBySrc[rs] : await DB.saveImage(rs));
      }
      if (look) await dropImages((look.refImageIds||[]).filter(function(id){ return keepIds.indexOf(id) < 0; }));
      if (_editId) {
        await DB.update('looks', _editId, {name:name, status:lookStatus, notes:document.getElementById('fLookNotes').value.trim()||null, refImageIds:keepIds});
      } else {
        await DB.create('looks', {charId:curChar.id, name:name, status:lookStatus, notes:document.getElementById('fLookNotes').value.trim()||null, refImageIds:keepIds, progress:0});
        await recalcProgress(curChar.id);
      }
      await loadLooks(curChar.id); renderLooks(); closeSheet(); toast(look?'Обновлено ✓':'Добавлено ✓','ok');
    }catch(e){toast('Ошибка: '+e.message,'err');}
    finally{ var btn=document.getElementById('fSaveBtn'); if(btn){btn.disabled=false;btn.textContent='Сохранить';} }
  });
  if(look) document.getElementById('fDelBtn').addEventListener('click', async function(){
    if(!confirm('Удалить образ вместе со всеми его предметами?')) return;
    try{ await removeLookCascade(look); await recalcProgress(curChar.id); await loadLooks(curChar.id); renderLooks(); closeSheet(); toast('Удалено','ok'); }
    catch(e){ toast('Ошибка: '+e.message,'err'); }
  });
}

// ----- ITEM FORM -----
function openAddItem()   { buildItemForm(null); }
function openEditItem(id){ buildItemForm(items.find(function(x){return x.id===id;})||null); }
function buildItemForm(item) {
  _editId = item ? item.id : null;
  _photoData = item ? (item._photoUrl||null) : null; _photoNew = false; _photoRemoved = false;
  _variantsDraft = item ? JSON.parse(JSON.stringify(item.variants||[])) : [];
  var itemStatus = item ? (item.status||'buy') : 'buy';
  var itemTypeIdx = item ? (item.typeIdx||0) : 0;
  openSheet(item ? 'Редактировать предмет' : 'Новый предмет');
  var typeOptions = TYPE_NAMES.map(function(t,i){
    return '<option value="'+i+'"'+(itemTypeIdx===i?' selected':'')+'>'+t+'</option>';
  }).join('');
  var delBtn = item ? '<button class="btn-del" id="fDelBtn">Удалить предмет</button>' : '';
  document.getElementById('formBody').innerHTML =
    '<div class="fg"><label class="fl">Фото</label>'
    + '<div class="img-up" id="fPhotoUp">'
    + '<span id="fPhotoLbl">📷 Добавить фото</span>'
    + (_photoData ? '<img id="fPhotoEl" src="'+esc(_photoData)+'"/>' : '<img id="fPhotoEl" style="display:none"/>')
    + '<div class="img-mask">🔄 Заменить</div></div>'
    + '<input type="file" id="fPhotoInput" accept="image/*" style="display:none"/>'
    + (_photoData ? '<button type="button" class="btn-rm" id="fPhotoRm">Убрать фото</button>' : '') + '</div>'
    + '<div class="fg"><label class="fl">Название *</label>'
    + '<input id="fItemName" class="fi" placeholder="Парик, меч, кимоно..." value="'+esc(item?item.name:'')+'"/></div>'
    + '<div class="frow">'
    + '<div class="fg"><label class="fl">Тип</label><select id="fItemType" class="fi">'+typeOptions+'</select></div>'
    + '<div class="fg"><label class="fl">Статус</label>'
    + '<div class="pill-sel" id="fItemStatus" style="flex-direction:column">'
    + '<button class="pill-opt" data-v="buy">Купить</button>'
    + '<button class="pill-opt" data-v="make">Шить/делать</button>'
    + '<button class="pill-opt" data-v="have">Уже есть</button>'
    + '</div></div></div>'
    + '<div class="fg"><label class="fl">Заметки</label>'
    + '<textarea id="fItemNotes" class="fi" placeholder="Размер, цвет, детали...">'+esc(item?item.notes||'':'')+'</textarea></div>'
    + '<div class="fg"><label class="fl">Варианты покупки</label>'
    + '<div class="vars-editor" id="fVarsEditor"></div>'
    + '<button class="btn-add-var" id="fAddVar">+ Добавить магазин</button></div>'
    + '<button class="btn-save" id="fSaveBtn">Сохранить</button>'
    + delBtn;
  if(_photoData) document.getElementById('fPhotoLbl').style.display='none';
  document.getElementById('fPhotoUp').addEventListener('click',function(){ document.getElementById('fPhotoInput').click(); });
  var rmP = document.getElementById('fPhotoRm');
  if (rmP) rmP.addEventListener('click', function(){
    _photoData = null; _photoNew = false; _photoRemoved = true;
    var img = document.getElementById('fPhotoEl'); img.style.display = 'none'; img.removeAttribute('src');
    document.getElementById('fPhotoLbl').style.display = ''; rmP.style.display = 'none';
  });
  document.getElementById('fPhotoInput').addEventListener('change',function(e){
    var f=e.target.files[0]; if(!f) return;
    var rd=new FileReader(); rd.onload=function(ev){
      _photoData=ev.target.result; _photoNew=true;
      var img=document.getElementById('fPhotoEl'); img.src=_photoData; img.style.display='block';
      document.getElementById('fPhotoLbl').style.display='none';
    }; rd.readAsDataURL(f);
  });
  function syncItemStatus(){
    document.getElementById('fItemStatus').querySelectorAll('.pill-opt').forEach(function(b){
      b.className='pill-opt';
      if(b.dataset.v===itemStatus) b.classList.add('on-'+itemStatus);
    });
  }
  syncItemStatus();
  document.getElementById('fItemStatus').addEventListener('click',function(e){
    var b=e.target.closest('.pill-opt'); if(!b) return;
    itemStatus=b.dataset.v; syncItemStatus();
  });
  function renderVars(){
    var ed=document.getElementById('fVarsEditor');
    ed.innerHTML=_variantsDraft.map(function(v,i){
      return '<div class="var-row'+(v.is_preferred?' pref':'')+'" data-i="'+i+'">'
        +'<div class="var-fields">'
        +'<input class="vs" placeholder="Название магазина" value="'+esc(v.shop_name||'')+'" data-f="shop_name" data-i="'+i+'"/>'
        +'<input class="vu" placeholder="Ссылка https://..." value="'+esc(v.url||'')+'" data-f="url" data-i="'+i+'"/>'
        +'<input class="vp" type="number" placeholder="Цена ₽" value="'+(v.price||'')+'" data-f="price" data-i="'+i+'"/>'
        +'</div>'
        +'<div class="var-right">'
        +'<button class="star-btn'+(v.is_preferred?' on':'')+'" data-i="'+i+'">⭐</button>'
        +'<button class="del-var" data-i="'+i+'">×</button>'
        +'</div></div>';
    }).join('');
    ed.querySelectorAll('.star-btn').forEach(function(btn){
      btn.addEventListener('click',function(){
        var idx=+btn.dataset.i;
        _variantsDraft.forEach(function(v,j){ v.is_preferred=(j===idx?!v.is_preferred:false); });
        renderVars();
      });
    });
    ed.querySelectorAll('.del-var').forEach(function(btn){
      btn.addEventListener('click',function(){ _variantsDraft.splice(+btn.dataset.i,1); renderVars(); });
    });
    ed.querySelectorAll('input').forEach(function(inp){
      inp.addEventListener('input',function(){
        var i=+inp.dataset.i, f=inp.dataset.f;
        _variantsDraft[i][f] = f==='price' ? (parseFloat(inp.value)||null) : inp.value;
      });
    });
  }
  renderVars();
  document.getElementById('fAddVar').addEventListener('click',function(){
    _variantsDraft.push({shop_name:'',url:'',price:null,is_preferred:false}); renderVars();
  });
  document.getElementById('fSaveBtn').addEventListener('click', async function(){
    var name=document.getElementById('fItemName').value.trim(); if(!name){toast('Введи название','err');return;}
    document.getElementById('fSaveBtn').disabled=true; document.getElementById('fSaveBtn').textContent='Сохранение...';
    try{
      var photoImageId = item ? (item.photoImageId||null) : null;
      if (_photoRemoved && photoImageId) { await dropImages([photoImageId]); photoImageId = null; }
      if (_photoNew && _photoData) {
        var newPhoto = await DB.saveImage(_photoData);
        if (photoImageId) await dropImages([photoImageId]);
        photoImageId = newPhoto;
      }
      var typeIdx = +document.getElementById('fItemType').value;
      var payload = {name:name, tagIds:[TYPE_TAGS[typeIdx]], status:itemStatus, notes:document.getElementById('fItemNotes').value.trim()||null, photoImageId:photoImageId, variants:_variantsDraft};
      var saved;
      if (_editId) {
        await DB.update('items', _editId, payload);
        saved = Object.assign({}, item, payload);
      } else {
        saved = await DB.create('items', {lookId:curLook.id, ...payload});
      }
      try { await syncPurchase(saved); } catch (pe) { toast('Предмет сохранён, но покупку создать не вышло', 'err'); }
      await recalcProgress(curChar.id, curLook.id);
      await loadItems(curLook.id); renderItems(); closeSheet(); toast(item?'Обновлено ✓':'Добавлено ✓','ok');
    }catch(e){toast('Ошибка: '+e.message,'err');}
    finally{ var btn=document.getElementById('fSaveBtn'); if(btn){btn.disabled=false;btn.textContent='Сохранить';} }
  });
  if(item) document.getElementById('fDelBtn').addEventListener('click', async function(){
    if(!confirm('Удалить предмет?')) return;
    try{ await removeItemCascade(item); await recalcProgress(curChar.id, curLook.id); await loadItems(curLook.id); renderItems(); closeSheet(); toast('Удалено','ok'); }
    catch(e){ toast('Ошибка: '+e.message,'err'); }
  });
}

// ----- BOOT -----
document.getElementById('overlay').addEventListener('click', closeSheet);
document.getElementById('formClose').addEventListener('click', closeSheet);
document.getElementById('fabAdd').addEventListener('click', function(){
  if(view==='chars') openAddChar();
  else if(view==='looks') openAddLook();
  else openAddItem();
});
async function syncNow(){
  showLoading();
  if(view==='chars') { await loadCharacters(); renderChars(); }
  else if(view==='looks') { await loadLooks(curChar.id); renderLooks(); }
  else { await loadItems(curLook.id); renderItems(); }
  toast('Обновлено','ok');
}

(async function(){
  await lifeosInit();
  await gotoChars();
})();
</script>

<!DOCTYPE html>
<html lang="ru" data-module="admin">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админка — каталог продуктов</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://organizz-core.pages.dev/styles.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="adm">
  <nav class="side" id="side" aria-label="Разделы админки">
    <button class="side-i active" data-tab="queue"><span class="si">📥</span><span class="sl">Заявки</span><span class="badge hidden" id="qBadge"></span></button>
    <button class="side-i" data-tab="products"><span class="si">🥕</span><span class="sl">Продукты</span></button>
    <button class="side-i" data-tab="diets"><span class="si">🎯</span><span class="sl">Режимы питания</span></button>
    <button class="side-i" data-tab="subs"><span class="si">⭐</span><span class="sl">Подписки</span></button>
    <button class="side-i" data-tab="log"><span class="si">📜</span><span class="sl">Журнал</span></button>
  </nav>
  <main class="adm-main">
    <div id="queuePane"></div>
    <div id="productsPane" class="hidden"></div>
    <div id="dietsPane" class="hidden"></div>
    <div id="subsPane" class="hidden"></div>
    <div id="logPane" class="hidden"></div>
  </main>
</div>

<script>window.LIFEOS_APP_SLUG = 'catalog';</script>
<script src="https://organizz-core.pages.dev/db.js"></script>
<script src="https://organizz-core.pages.dev/nav.js"></script>
<script src="https://organizz-core.pages.dev/shell.js"></script>
<script>window.LifeShell = window.LifeShell || { mount() {}, update() {} };  /* core ещё не обновлён — без шапки, но без падения */</script>
<script>LifeShell.mount({ module: 'admin', title: 'Каталог продуктов' });</script>
<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Питание — LifeOS</title>
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://organizz-core.pages.dev/styles.css">
<link rel="stylesheet" href="menuplan-local.css">
<link rel="stylesheet" href="recipes-local.css">
</head>
<body>
<div id="app">
  <header id="app-header" class="hidden">
    <button id="header-back" class="icon-btn hidden" onclick="Router.back()">←</button>
    <button id="header-hub" class="icon-btn" onclick="location.href='../hub/'" title="Hub">⌂</button>
    <div id="header-title-wrap">
      <span id="header-icon"></span>
      <h1 id="header-title">Питание</h1>
    </div>
    <div id="header-actions"></div>
  </header>
  <main id="app-content">
    <div class="empty"><div class="empty-icon">🍽️</div><div class="empty-desc">Загрузка…</div></div>
  </main>
  <nav id="bottom-nav" class="hidden">
    <button class="nav-item" data-route="recipes"><span class="nav-icon">📖</span><span class="nav-label">Рецепты</span></button>
    <button class="nav-item" data-route="collections"><span class="nav-icon">📚</span><span class="nav-label">Коллекции</span></button>
    <button class="nav-item" data-route="products"><span class="nav-icon">🥕</span><span class="nav-label">Продукты</span></button>
  </nav>
</div>

<!-- ВАЖНО: слаг модуля — до db.js, иначе данные уйдут в projects -->
<script>window.LIFEOS_APP_SLUG = 'meals';</script>
<script src="https://organizz-core.pages.dev/db.js"></script>
<script src="https://organizz-core.pages.dev/nav.js"></script>
<script src="https://organizz-core.pages.dev/ui.js"></script>
<script src="db.js"></script>
<script src="utils.js"></script>
<script src="router.js"></script>
<script src="components.js"></script>
<script src="screens/recipes.js"></script>
<script src="screens/recipe-view.js"></script>
<script src="screens/recipe-edit.js"></script>
<script src="screens/collections.js"></script>
<script src="screens/products.js"></script>
<script src="screens/suggestions.js"></script>
<script src="screens/product-edit.js"></script>
<script src="ai-import.js"></script>
<script src="app.js"></script>
<script>
  // Service worker старого модуля не используется (мог закэшировать старую версию) — снимаем регистрацию
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
  }
</script>
</body>
</html>

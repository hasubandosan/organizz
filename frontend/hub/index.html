<!DOCTYPE html>  
<html lang="ru">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">  
<meta name="apple-mobile-web-app-capable" content="yes">  
<meta name="theme-color" content="#0a0a0f">  
<title>LifeOS — Hub</title>  
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">  
<link rel="stylesheet" href="../core/styles.css">  
<style>  
.hub-modules { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 16px; }  
.module-tile {  
  background: var(--bg2); border: 1px solid var(--border);  
  border-radius: var(--r); padding: 20px 16px;  
  display: flex; flex-direction: column; align-items: flex-start; gap: 8px;  
  cursor: pointer; transition: .15s; text-decoration: none; color: inherit;  
  position: relative; overflow: hidden;  
}  
.module-tile::before { content:""; position:absolute; inset:0; background: linear-gradient(135deg, transparent 60%, rgba(91,110,245,.06)); opacity:0; transition:.15s; }  
.module-tile:hover { border-color: var(--accent); transform: translateY(-2px); }  
.module-tile:hover::before { opacity:1; }  
.module-tile.disabled { opacity: .4; cursor: default; pointer-events: none; }  
.module-tile.disabled:hover { border-color: var(--border); transform: none; }  
.module-icon { font-size: 28px; }  
.module-name { font-size: 14px; font-weight: 700; }  
.module-desc { font-size: 12px; color: var(--text3); line-height: 1.4; }  
.module-badge {  
  position: absolute; top: 10px; right: 10px;  
  font-size: 10px; font-weight: 700; font-family: var(--m);  
  background: var(--accent); color: #fff;  
  border-radius: 20px; padding: 1px 6px;  
}  
.module-badge.soon { background: var(--bg3); color: var(--text3); border: 1px solid var(--border2); }  
.storage-warn {  
  margin: 0 16px 12px; padding: 10px 14px;  
  background: rgba(240,80,96,.1); border: 1px solid rgba(240,80,96,.3);  
  border-radius: var(--r); font-size: 13px; color: var(--red);  
  display: none;  
}  
</style>  
</head>  
<body>  
<div class="shell">  
  <header class="topbar">  
    <div class="topbar-logo">Life<span>OS</span></div>  
    <div class="topbar-spacer"></div>  
    <button class="topbar-btn" id="btn-export" title="Экспорт данных">↓</button>  
    <button class="topbar-btn" id="btn-import" title="Импорт данных">↑</button>  
    <button class="topbar-btn" id="btn-storage" title="Хранилище">💾</button>  
    <button class="topbar-btn" id="btn-search" title="Поиск">  
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>  
    </button>  
    <button class="topbar-btn" id="btn-logout" title="Выйти">⎋</button>  
  </header>  

  <main class="content">  
    <div class="section" style="padding-top:20px">  
      <div id="greeting" style="font-size:22px;font-weight:800;margin-bottom:4px"></div>  
      <div id="hub-date" style="font-size:13px;color:var(--text3);font-family:var(--m)"></div>  
      <div id="hub-user" style="font-size:12px;color:var(--text3);font-family:var(--m);margin-top:2px"></div>  
    </div>  

    <div class="storage-warn" id="storageWarn"></div>  

    <div class="stat-grid" id="hub-stats" style="padding-top:16px"></div>  

    <div class="section">  
      <div class="section-header">  
        <span class="section-title">Активные проекты</span>  
        <a href="../projects/" class="section-action">Открыть →</a>  
      </div>  
      <div id="widget-projects"></div>  
    </div>  

    <div class="section">  
      <div class="section-header">  
        <span class="section-title">Открытые задачи</span>  
        <a href="../projects/#tasks" class="section-action">Открыть →</a>  
      </div>  
      <div id="widget-tasks"></div>  
    </div>  

    <div class="section">  
      <div class="section-header">  
        <span class="section-title">Покупки</span>  
        <a href="../purchases/" class="section-action">Открыть →</a>  
      </div>  
      <div id="widget-purchases"></div>  
    </div>  

    <div class="section" style="margin-top:8px">  
      <div class="section-header"><span class="section-title">Модули</span></div>  
    </div>  
    <div class="hub-modules">  
      <a class="module-tile" href="../projects/index.html">  
        <div class="module-icon">📁</div>  
        <div class="module-name">Проекты</div>  
        <div class="module-desc">Области, задачи, бюджет</div>  
        <div class="module-badge">active</div>  
      </a>  
      <a class="module-tile" href="../purchases/index.html">  
        <div class="module-icon">🛒</div>  
        <div class="module-name">Покупки</div>  
        <div class="module-desc">Списки и вишлисты</div>  
      </a>  
      <a class="module-tile" href="../cosplays/index.html">  
        <div class="module-icon">🎭</div>  
        <div class="module-name">Косплей</div>  
        <div class="module-desc">Персонажи и образы</div>  
        <div class="module-badge soon">demo</div>  
      </a>  
      <a class="module-tile" href="../meals/index.html">  
        <div class="module-icon">🥗</div>  
        <div class="module-name">Питание</div>  
        <div class="module-desc">Меню и рецепты</div>  
        <div class="module-badge active">активен</div>  
      </a>  
    </div>  
    <div style="height:16px"></div>  
  </main>  
</div>  

<input type="file" id="file-import" accept=".json" style="display:none">  

<script src="../core/db.js"></script>
<script src="../core/nav.js"></script>  
<script src="../core/ui.js"></script>  
<script>  
'use strict';  

function esc(s) {  
  const a = '&' + 'amp;';  
  const l = '&' + 'lt;';  
  const g = '&' + 'gt;';  
  const q = '&' + 'quot;';  
  return String(s || '').replace(/&/g, a).replace(/</g, l).replace(/>/g, g).replace(/"/g, q);  
}  

function renderGreeting() {  
  const h = new Date().getHours();  
  const greet = h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер';  
  document.getElementById('greeting').textContent = greet;  
  document.getElementById('hub-date').textContent =  
    new Date().toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long', year:'numeric' });  
}  

function renderStorageWarn() {  
  const info = DB.storageInfo();  
  const el = document.getElementById('storageWarn');  
  if (info.pct > 80) {  
    el.style.display = 'block';  
    el.textContent = `Хранилище заполнено на ${info.pct}% (${info.mb} МБ). Сделай экспорт и удали старые фото.`;  
  } else {  
    el.style.display = 'none';  
  }  
}  

async function renderStats() {  
  const s = await DB.stats();  
  document.getElementById('hub-stats').innerHTML = `  
    <div class="stat-card s-blue"><div class="stat-num">${s.projects}</div><div class="stat-lbl">Проекты</div></div>  
    <div class="stat-card s-green"><div class="stat-num">${s.tasks}</div><div class="stat-lbl">Задачи</div></div>  
    <div class="stat-card s-yellow"><div class="stat-num">${s.active}</div><div class="stat-lbl">Активные</div></div>  
    <div class="stat-card s-red"><div class="stat-num">${s.purchases}</div><div class="stat-lbl">Покупки</div></div>`;  
}  

async function renderProjects() {  
  const active = await DB.query('projects', { status: 'in_progress' });  
  const el = document.getElementById('widget-projects');  
  if (!active.length) {  
    el.innerHTML = UI.emptyState('📁', 'Нет активных проектов', 'Создай проект в модуле Проекты');  
    return;  
  }  
  const areas = await DB.getAll('areas');  
  const aMap = Object.fromEntries(areas.map(a => [a.id, a]));  
  el.innerHTML = active.slice(0, 3).map(p => {  
    const area = aMap[p.areaId];  
    return `<div class="card clickable" onclick="location.href='../projects/?p=${p.id}'">  
      <div class="card-head">  
        <div class="card-icon">${area ? area.emoji : '📁'}</div>  
        <div>  
          <div class="card-title">${esc(p.name)}</div>  
          <div class="card-meta">${area ? esc(area.name) : ''} ${p.endDate ? '· ' + UI.date(p.endDate) : ''}</div>  
        </div>  
      </div>  
      <div class="card-footer">${UI.statusBadge(p.status)}${UI.priorityBadge(p.priority)}</div>  
    </div>`;  
  }).join('');  
}  

async function renderTasks() {  
  const all = await DB.getAll('tasks');  
  const open = all.filter(t => !['completed','archived','cancelled'].includes(t.status) && !t.parentId).slice(0, 5);  
  const el = document.getElementById('widget-tasks');  
  if (!open.length) {  
    el.innerHTML = UI.emptyState('✅', 'Всё сделано!', 'Нет открытых задач');  
    return;  
  }  
  el.innerHTML = `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:4px 14px">` +  
    open.map(t => {  
      const overdue = UI.isOverdue(t.dueDate, t.status);  
      return `<div class="task-row">  
        <div class="task-body" onclick="location.href='../projects/#tasks'">  
          <div class="task-title">${esc(t.name)}</div>  
          <div class="task-meta">  
            ${t.dueDate ? `<span class="${overdue ? 'task-overdue' : ''}">📅 ${UI.date(t.dueDate)}</span>` : ''}  
            ${UI.priorityBadge(t.priority)}  
          </div>  
        </div>  
      </div>`;  
    }).join('') + '</div>';  
}  

async function renderPurchases() {  
  const all = (await DB.getAll('purchases', 'purchases').catch(() => [])).filter(p => p.status !== 'in_stock');
  const allVariants = await DB.getAll('purchase_variants', 'purchases').catch(() => []);  
  // Цена теперь живёт на основном (primary) варианте покупки, а не на самой
  // покупке — читаем её через DB.getPrimaryVariant, с фолбэком на старое
  // плоское поле price для записей, созданных до модели вариантов.
  const withPrice = await Promise.all(all.map(async p => {
    const vs = allVariants.filter(v => v.purchaseId === p.id);
    const pv = vs.find(v => v.isPrimary) || vs[0] || null;
    const price = pv ? pv.price : (p.price ?? null);
    return { ...p, _price: price };
  }));
  const pending = withPrice
    .sort((a, b) => (b.priority || 0) - (a.priority || 0))  
    .slice(0, 5);  
  const el = document.getElementById('widget-purchases');  
  if (!pending.length) {  
    el.innerHTML = UI.emptyState('🛒', 'Список пуст', 'Добавь покупки в модуле Покупки');  
    return;  
  }  
  el.innerHTML = `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:4px 14px">` +  
    pending.map(p => `<div class="pur-row" onclick="location.href='../purchases/'">  
      <div class="pur-name">${esc(p.name)}</div>  
      <div class="pur-price">${p._price ? UI.money(p._price) : ''}</div>  
    </div>`).join('') + '</div>';  
}  

document.getElementById('btn-search').addEventListener('click', async () => {  
  const term = prompt('Поиск по LifeOS:');  
  if (!term) return;  
  const results = await DB.search(['projects','tasks'], term);  
  if (!results.length) { UI.toast('Ничего не найдено', 'info'); return; }  
  location.href = `../projects/?q=${encodeURIComponent(term)}`;  
});  

/* ── Пользователь и выход ── */
(function () {
  const email = localStorage.getItem('email');
  if (email) document.getElementById('hub-user').textContent = email;
  document.getElementById('btn-logout').addEventListener('click', () => {
    if (!confirm('Выйти из аккаунта?')) return;
    localStorage.removeItem('token');
    localStorage.removeItem('email');
    location.href = '/login.html';
  });
})();

document.getElementById('btn-export').addEventListener('click', async () => {  
  const b = await DB.exportAll();  
  const blob = new Blob([JSON.stringify(b, null, 2)], { type: 'application/json' });  
  const a = document.createElement('a');  
  a.href = URL.createObjectURL(blob);  
  a.download = `lifeos-${new Date().toISOString().split('T')[0]}.json`;  
  a.click();  
  URL.revokeObjectURL(a.href);  
  UI.toast('Данные экспортированы', 'ok');  
});  

document.getElementById('btn-import').addEventListener('click', () => {  
  document.getElementById('file-import').click();  
});  

document.getElementById('file-import').addEventListener('change', async e => {  
  const file = e.target.files[0];  
  if (!file) return;  
  const reader = new FileReader();  
  reader.onload = async ev => {  
    try {  
      const b = JSON.parse(ev.target.result);  
      if (!confirm(`Импортировать данные от ${b.exportedAt || '?'}? Объединит с текущими.`) ) return;  
      await DB.importAll(b);  
      UI.toast('Импортировано', 'ok');  
      await init();  
    } catch {  
      UI.toast('Ошибка импорта', 'err');  
    }  
  };  
  reader.readAsText(file);  
  e.target.value = '';  
});  

document.getElementById('btn-storage').addEventListener('click', () => {  
  const info = DB.storageInfo();  
  UI.toast(`${info.mb} МБ · ${info.pct}% · ${info.driver}`, 'info', 5000);  
});  

async function init() {  
  await lifeosInit();  
  renderGreeting();  
  renderStorageWarn();  
  await renderStats();  
  await renderProjects();  
  await renderTasks();  
  await renderPurchases();  
}  

init().catch(e => {  
  document.body.innerHTML = `<div style="padding:40px;color:#f05060;font-family:monospace">Hub error: ${esc(e.message)}</div>`;  
});  
</script>  
</body>  
</html>
